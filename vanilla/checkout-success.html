<!doctype html>
<html lang="pl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Zamówienie — Wholesale</title><link rel="stylesheet" href="css/style.css"/></head>
<body>
<div id="site-header"></div>
<div style="max-width:600px;margin:40px auto;padding:0 16px">
<div style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;text-align:center">
<div style="width:48px;height:48px;background:#ecfdf5;color:#065f46;border-radius:50%;display:grid;place-items:center;margin:0 auto;font-size:20px">✓</div>
<h1 style="margin-top:12px;font-size:22px;font-weight:800">Zamówienie złożone</h1>
<p style="color:#64748b;font-size:13px;margin-top:4px">Dziękujemy — COD/faktura ręczna. Status: oczekujące.</p>
<p id="orderId" style="font-size:11px;color:#94a3b8;margin-top:8px"></p>
<div id="order" style="margin-top:16px;text-align:left;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;font-size:13px;display:none"></div>
<div style="margin-top:16px;display:flex;gap:12px;justify-content:center">
<a href="categories.html" class="btn btn--dark">Kontynuuj zakupy</a>
<a href="buyer-orders.html" class="btn">Moje zamówienia</a>
</div>
</div>
</div>
<script src="js/api.js"></script><script src="js/common.js"></script>
<script>
injectHeader([]); injectFooter();
const id=new URLSearchParams(location.search).get('orderId');
if(id){
  document.getElementById('orderId').textContent='Zamówienie #'+id.slice(0,8);
  Api.getOrder(id).then(o=>{
    const el=document.getElementById('order');
    el.style.display='block';
    el.innerHTML=`<div>Suma netto: ${Number(o.total_net).toFixed(2)} zł</div><div style="font-weight:800">Suma brutto: ${Number(o.total_gross).toFixed(2)} zł</div><div style="font-size:12px;color:#64748b;margin-top:4px">Wysyłka: ${o.shipping_address}</div>`;
  }).catch(()=>{});
}
</script>
</body></html>
