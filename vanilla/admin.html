<!doctype html>
<html lang="pl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Admin — Wholesale</title><link rel="stylesheet" href="css/style.css"/></head>
<body>
<div id="site-header"></div>
<div class="container" style="padding:24px 16px">
<h1 style="font-size:24px;font-weight:800">Panel administratora</h1>
<p style="color:#64748b">Zatwierdzanie sprzedawców i kategorii</p>
<div style="margin-top:16px;display:flex;gap:12px"><a href="categories.html" class="btn">Kategorie</a><a href="index.html" class="btn">Sklep</a></div>
<h2 style="margin-top:24px;font-weight:700">Oczekujący sprzedawcy</h2>
<div id="sellers" style="margin-top:8px"></div>
<h2 style="margin-top:24px;font-weight:700">Oczekujące kategorie</h2>
<div id="catreq" style="margin-top:8px"></div>
</div>
<div id="site-footer"></div>
<script src="js/api.js"></script><script src="js/common.js"></script>
<script>
async function load(){
  injectHeader([]); injectFooter();
  try{
    const sellers=await Api.getPendingSellers();
    document.getElementById('sellers').innerHTML = sellers.length? `<div class="table-wrap"><table><thead><tr><th>Firma</th><th>Wnioskodawca</th><th>Email</th><th>Akcje</th></tr></thead><tbody>${sellers.map(s=>`<tr><td>${s.business_name}</td><td>${s.full_name}</td><td>${s.email}</td><td><button class="btn btn--dark" style="padding:6px 12px;font-size:12px" onclick="approve('${s.id}')">Zatwierdź</button> <button class="btn" style="padding:6px 12px;font-size:12px" onclick="reject('${s.id}')">Odrzuć</button></td></tr>`).join('')}</tbody></table></div>` : '<p style="padding:12px;background:#fff;border:1px solid #e2e8f0;border-radius:12px">Brak oczekujących</p>';
  }catch(e){ document.getElementById('sellers').innerHTML='<p style="color:#ef4444">'+e.message+'</p>'; }
  try{
    const reqs=await Api.listCategoryRequests({status:'pending'});
    document.getElementById('catreq').innerHTML = reqs.length? reqs.map(r=>`<div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:8px"><b>${r.name}</b> <small>/${r.slug}</small> — ${r.parent_name||'Główna'}<br><small>${r.requester_email}</small><p style="font-size:13px">${r.description||''}</p><button class="btn btn--dark" style="padding:6px 12px;font-size:12px" onclick="approveCat('${r.id}')">Zatwierdź</button> <button class="btn" style="padding:6px 12px;font-size:12px" onclick="rejectCat('${r.id}')">Odrzuć</button></div>`).join('') : '<p style="padding:12px;background:#fff;border:1px solid #e2e8f0;border-radius:12px">Brak zgłoszeń</p>';
  }catch(e){ document.getElementById('catreq').innerHTML='<p style="color:#ef4444">'+e.message+'</p>'; }
}
async function approve(id){ await Api.approveSeller(id,'approved'); load(); }
async function reject(id){ const r=prompt('Powód odrzucenia:'); if(!r) return; await Api.approveSeller(id,'rejected',r); load(); }
async function approveCat(id){ await Api.decideCategoryRequest(id,'approve'); load(); }
async function rejectCat(id){ const r=prompt('Powód:'); if(!r) return; await Api.decideCategoryRequest(id,'reject',r); load(); }
load();
</script>
</body></html>
