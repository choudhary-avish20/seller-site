<!doctype html>
<html lang="pl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Rejestracja — Wholesale</title><link rel="stylesheet" href="css/style.css"/></head>
<body style="background:#f8fafc"><div id="site-header"></div>
<div style="max-width:420px;margin:40px auto;padding:0 16px">
<div class="card">
<div style="text-align:center"><div style="width:48px;height:48px;border-radius:12px;background:#4f46e5;color:#fff;display:grid;place-items:center;font-weight:700;margin:0 auto">W</div><h1 style="margin:12px 0;font-size:22px;font-weight:800">Utwórz konto</h1><p style="font-size:13px;color:#64748b">Masz już konto? <a href="login.html" style="color:#4f46e5">Zaloguj się</a></p></div>
<div id="error" class="error" style="display:none;margin-top:16px"></div>
<form id="form" style="margin-top:16px">
<div class="form-group"><label class="label">Imię i nazwisko</label><input id="full" class="input" required placeholder="Imię i nazwisko"></div>
<div class="form-group"><label class="label">Email</label><input id="email" class="input" type="email" required placeholder="Adres e-mail"></div>
<div class="form-group"><label class="label">Hasło (min 8)</label><input id="pwd" class="input" type="password" required></div>
<div class="form-group"><label class="label">Potwierdź hasło</label><input id="pwd2" class="input" type="password" required></div>
<div class="form-group"><label class="label" style="margin-bottom:6px">Rejestruj jako</label><div style="display:flex;gap:8px"><label style="flex:1;display:flex;gap:8px;align-items:center;padding:12px;border:1px solid #e2e8f0;border-radius:12px;cursor:pointer"><input type="radio" name="role" value="buyer" checked> Kupujący</label><label style="flex:1;display:flex;gap:8px;align-items:center;padding:12px;border:1px solid #e2e8f0;border-radius:12px;cursor:pointer"><input type="radio" name="role" value="seller"> Sprzedawca</label></div></div>
<button type="submit" id="btn" class="btn btn--dark" style="width:100%;padding:12px;border-radius:999px">Utwórz konto</button>
</form>
</div></div>
<script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/cart.js"></script><script src="js/common.js"></script>
<script>
injectHeader([]); injectFooter();
document.getElementById('form').addEventListener('submit', async e=>{
 e.preventDefault();
 const err=document.getElementById('error'); err.style.display='none';
 const full=document.getElementById('full').value, email=document.getElementById('email').value, pwd=document.getElementById('pwd').value, pwd2=document.getElementById('pwd2').value;
 const role=document.querySelector('input[name=role]:checked').value;
 if(pwd!==pwd2){ err.textContent='Hasła nie są zgodne'; err.style.display='block'; return; }
 if(pwd.length<8){ err.textContent='Hasło min 8 znaków'; err.style.display='block'; return; }
 const btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='Tworzenie…';
 try{ await Auth.signup(email,pwd,full,role); location.href='index.html'; }catch(ex){ err.textContent=ex.message; err.style.display='block'; } finally{ btn.disabled=false; btn.textContent='Utwórz konto'; }
});
</script>
</body></html>
