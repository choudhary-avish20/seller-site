<!doctype html>
<html lang="pl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Kategorie — Wholesale</title><link rel="stylesheet" href="css/style.css"/></head>
<body>
<div id="site-header"></div>
<div class="container" style="padding:24px 16px;display:flex;gap:24px;flex-direction:column">
<div id="layout" class="layout">
  <aside class="sidebar"><div class="sidebar__card"><div class="sidebar__head"><span class="sidebar__title">Kategorie hurtowni</span></div><div class="sidebar__body" id="sidebar"></div></div></aside>
  <main style="flex:1">
    <h1 style="font-size:24px;font-weight:800">Wszystkie kategorie</h1>
    <p style="color:#64748b;font-size:14px">Przeglądaj według kategorii — boczny panel jak centrumhurt.pl</p>
    <div id="cats" class="grid4" style="margin-top:16px"></div>
    <h2 style="margin-top:32px;font-size:18px;font-weight:700">Wszystkie produkty</h2>
    <div id="prods" class="grid3" style="margin-top:12px"></div>
  </main>
</div>
</div>
<div id="site-footer"></div>
<script src="js/api.js"></script><script src="js/i18n.js"></script><script src="js/cart.js"></script><script src="js/common.js"></script>
<script>
async function load(){
  const [tree, prods] = await Promise.all([Api.getCategoryTree(false).catch(()=>[]), Api.listProducts({limit:12}).catch(()=>[])]);
  injectHeader(tree); injectFooter();
  // sidebar
  const sb=document.getElementById('sidebar');
  sb.innerHTML = `<a href="categories.html" class="side-link active">Wszystkie produkty →</a>` + tree.map(n=>`<a href="category.html?slug=${n.slug}" class="side-link">${n.name}<span style="margin-left:auto;font-size:11px;color:#94a3b8">/${n.slug}</span></a><div style="margin-left:12px;border-left:1px solid #f1f5f9;padding-left:8px">${(n.children||[]).map(c=>`<a href="category.html?slug=${c.slug}" class="side-link" style="font-size:13px">${c.name}</a>`).join('')}</div>`).join('');
  // cats
  document.getElementById('cats').innerHTML = tree.map(c=>`
    <a href="category.html?slug=${c.slug}" class="tile"><h3>${c.name}</h3><p style="font-size:11px;color:#94a3b8">/${c.slug}</p><div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">${c.children.slice(0,3).map(s=>`<span style="font-size:11px;padding:4px 8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:999px">${s.name}</span>`).join('')}</div><p style="font-size:12px;color:#4f46e5;margin-top:8px">${c.children.length} podkategorii →</p></a>
  `).join('');
  // prods
  const el=document.getElementById('prods');
  if(!prods.length) el.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:16px">Brak produktów</p>';
  else el.innerHTML = prods.map(p=>{
    const out = p.stock_status==='out_of_stock'||p.stock_quantity===0;
    const img = p.images && p.images[0] ? getImageUrl(p.images[0]) : '';
    return `<div class="product"><a href="product.html?slug=${p.slug}" style="display:block;position:relative;background:#f8fafc;aspect-ratio:4/3;overflow:hidden">${img?`<img src="${img}" style="width:100%;height:100%;object-fit:cover">`:`<div style="display:grid;place-items:center;height:100%;color:#94a3b8">No image</div>`}<span style="position:absolute;left:12px;top:12px;padding:4px 8px;background:rgba(255,255,255,.95);border:1px solid #e2e8f0;border-radius:999px;font-size:11px">${p.category_name||''}</span></a><div style="padding:16px"><a href="product.html?slug=${p.slug}" style="font-size:13px;font-weight:500;color:#0f172a">${p.name}</a><div style="margin-top:8px;display:flex;justify-content:space-between"><div><div style="font-size:18px;font-weight:800;color:#4338ca">${Number(p.price_net).toFixed(2)} zł <small style="font-size:11px;color:#64748b">netto</small></div><div style="font-size:12px;color:#64748b">${Number(p.price_gross).toFixed(2)} zł brutto • VAT ${p.vat_rate}%</div></div><span style="padding:4px 10px;background:#eef2ff;border:1px solid #e0e7ff;color:#4338ca;border-radius:999px;font-size:12px;white-space:nowrap">Pack ${p.pack_size}</span></div><div style="margin-top:8px;font-size:12px;color:${out?'#ef4444':'#10b981'}">${out?'Brak':p.stock_quantity+' paczek'}</div><button class="add" style="margin-top:12px;width:100%" onclick='Cart.addToCart({id:"${p.id}",slug:"${p.slug}",name:"${p.name.replace(/"/g,'&quot;')}",price_net:${p.price_net},price_gross:${p.price_gross},vat_rate:${p.vat_rate},pack_size:${p.pack_size},stock_status:"${p.stock_status}",stock_quantity:${p.stock_quantity},category_name:"${(p.category_name||'').replace(/"/g,'')}",images:${JSON.stringify(p.images)}} ,1);alert("Dodano")' ${out?'disabled':''}>Dodaj</button></div></div>`;
  }).join('');
}
load();
</script>
</body></html>
