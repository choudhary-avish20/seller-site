<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Log in — Wholesale</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body style="background:#f8fafc">
<div id="site-header"></div>
<div style="max-width:420px;margin:40px auto;padding:0 16px">
  <div style="display:flex;justify-content:flex-end;margin-bottom:8px"><span class="lang-toggle" style="display:inline-flex;border:1px solid #e2e8f0;border-radius:999px;overflow:hidden;background:#fff"><button data-lang="pl" style="padding:6px 12px;font-size:12px;border:0">PL</button><button data-lang="en" style="padding:6px 12px;font-size:12px;border:0">EN</button></span></div>
  <div class="card">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:48px;height:48px;border-radius:12px;background:#4f46e5;color:#fff;display:grid;place-items:center;font-weight:700;margin:0 auto">W</div>
      <h1 style="margin:12px 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em">Zaloguj się</h1>
      <p style="font-size:13px;color:#64748b">lub <a href="signup.html" style="color:#4f46e5;font-weight:600">utwórz nowe konto</a></p>
    </div>
    <div id="error" class="error" style="display:none"></div>
    <form id="loginForm">
      <div class="form-group"><label class="label">Email</label><input id="email" class="input" type="email" required placeholder="Adres e-mail"></div>
      <div class="form-group"><label class="label">Hasło</label><input id="password" class="input" type="password" required placeholder="Hasło"></div>
      <button type="submit" id="btn" class="btn btn--dark" style="width:100%;padding:12px;border-radius:999px">Zaloguj się</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:13px"><a href="register-seller.html" style="color:#4f46e5">Zarejestruj się jako sprzedawca →</a></p>
    <p style="text-align:center;margin-top:8px;font-size:12px;color:#94a3b8"><a href="index.html">← Strona główna</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/common.js"></script>
<script>
injectHeader([]); injectFooter();
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('btn'); const err=document.getElementById('error');
  err.style.display='none'; btn.disabled=true; btn.textContent='Logowanie…';
  try{
    await Auth.login(document.getElementById('email').value, document.getElementById('password').value);
    const user = JSON.parse(localStorage.getItem('user')||'{}');
    const params = new URLSearchParams(location.search);
    const cb = params.get('callbackUrl');
    if(cb) location.href=cb;
    else if(user.role==='seller') location.href='seller.html';
    else if(user.role==='admin') location.href='admin.html';
    else location.href='index.html';
  }catch(ex){ err.textContent=ex.message; err.style.display='block'; }
  finally{ btn.disabled=false; btn.textContent='Zaloguj się'; }
});
// lang toggle
document.querySelectorAll('.lang-toggle [data-lang]').forEach(b=>b.addEventListener('click',()=>{localStorage.setItem('lang', b.dataset.lang); location.reload();}));
</script>
</body>
</html>
