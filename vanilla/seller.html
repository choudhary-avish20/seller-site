<!doctype html>
<html lang="pl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Seller — Wholesale</title><link rel="stylesheet" href="css/style.css"/></head>
<body>
<div id="site-header"></div>
<div class="container" style="padding:24px 16px">
<h1 style="font-size:24px;font-weight:800">Panel sprzedawcy</h1>
<p id="welcome" style="color:#64748b"></p>
<div id="status" style="margin-top:12px"></div>
<div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:16px">
<a href="seller-products.html" class="tile"><h3>Produkty</h3><p style="font-size:13px;color:#64748b">Zarządzaj katalogiem</p></a>
<a href="categories.html" class="tile"><h3>Kategorie</h3><p style="font-size:13px;color:#64748b">Przeglądaj i zgłaszaj</p></a>
<a href="#" onclick="alert('Orders — see API /orders');return false;" class="tile"><h3>Zamówienia</h3><p style="font-size:13px;color:#64748b">Przeglądaj zamówienia</p></a>
</div>
<div id="products" style="margin-top:24px"></div>
</div>
<div id="site-footer"></div>
<script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/cart.js"></script><script src="js/common.js"></script>
<script>
async function load(){
  const tree=await Api.getCategoryTree(false).catch(()=>[]);
  injectHeader(tree); injectFooter();
  const user = JSON.parse(localStorage.getItem('user')||'null');
  if(!user || user.role!=='seller'){ document.getElementById('status').innerHTML='<p style="color:#ef4444">Zaloguj się jako sprzedawca. <a href="login.html">Login</a></p>'; return; }
  document.getElementById('welcome').textContent=`Witamy, ${user.full_name}`;
  try{
    const profile = await Api.getMySellerProfile();
    const status = profile.status;
    document.getElementById('status').innerHTML = `<span class="badge ${status==='approved'?'badge--green': status==='pending'?'badge--yellow':'badge--red'}">${status}</span> ${profile.business_name}`;
    if(status!=='approved'){
      document.getElementById('products').innerHTML=`<p style="padding:16px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px">Konto niezatwierdzone — oczekuj na admina. Status: ${status}</p>`;
      return;
    }
    const prods = await Api.listMyProducts();
    document.getElementById('products').innerHTML = `<h2 style="font-weight:700;margin-top:16px">Moje produkty (${prods.length})</h2><div style="margin-top:8px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">` + prods.map(p=>`<div class="tile"><p style="font-weight:600">${p.name}</p><p style="font-size:12px;color:#64748b">Pack ${p.pack_size} • ${Number(p.price_net).toFixed(2)} zł netto</p><a href="product.html?slug=${p.slug}" style="font-size:12px;color:#4f46e5">Zobacz →</a></div>`).join('') + `</div><p style="margin-top:12px"><a href="seller-products.html" class="btn btn--dark">Zarządzaj produktami →</a></p>`;
  }catch(e){
    document.getElementById('status').innerHTML='<p style="color:#ef4444">'+e.message+'</p>';
  }
}
load();
</script>
</body></html>
