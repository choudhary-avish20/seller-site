<!doctype html>
<html lang="pl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Produkt — Wholesale</title><link rel="stylesheet" href="css/style.css"/></head>
<body>
<div id="site-header"></div>
<div class="container" style="padding:24px 16px">
<div id="breadcrumb" style="font-size:13px;color:#64748b;margin-bottom:12px"></div>
<div id="content" style="display:grid;gap:24px"></div>
</div>
<div id="site-footer"></div>
<script src="js/api.js"></script><script src="js/i18n.js"></script><script src="js/cart.js"></script><script src="js/common.js"></script>
<script>
async function load(){
  const params=new URLSearchParams(location.search);
  const slug=params.get('slug');
  if(!slug){ document.getElementById('content').innerHTML='<p>Brak slug</p>'; return; }
  try{
    const p = await Api.getProductBySlug(slug);
    Api.getCategoryTree(false).then(t=> injectHeader(t)).catch(()=> injectHeader([]));
    injectFooter();
    document.getElementById('breadcrumb').innerHTML=`<a href="categories.html">Kategorie</a> / <a href="category.html?slug=${p.category_slug}">${p.category_name||''}</a> / <b style="color:#0f172a">${p.name}</b>`;
    const out = p.stock_status==='out_of_stock'||p.stock_quantity===0;
    const img = p.images && p.images[0] ? getImageUrl(p.images[0]) : '';
    const variants = p.variants||[];
    document.getElementById('content').innerHTML=`
      <div style="display:grid;gap:24px;grid-template-columns:1fr">
        <div style="display:grid;gap:24px;grid-template-columns:1fr 1fr">
          <div style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px">
            ${img?`<img src="${img}" style="width:100%;height:400px;object-fit:contain;background:#f8fafc;border-radius:12px">`:`<div style="height:400px;display:grid;place-items:center;background:#f1f5f9;border-radius:12px;color:#64748b">No image</div>`}
            <div style="margin-top:12px;display:flex;gap:8px;overflow:auto">${(p.images||[]).map(im=>`<img src="${getImageUrl(im)}" style="width:80px;height:80px;object-fit:cover;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc">`).join('')}</div>
          </div>
          <div>
            <h1 style="font-size:24px;font-weight:800">${p.name}</h1>
            <p style="font-size:13px;color:#64748b">/${p.slug} • ${p.seller_business_name||'Wholesale seller'}</p>
            <div style="margin-top:16px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px">
              <div style="font-size:22px;font-weight:800;color:#4338ca">${Number(p.price_net).toFixed(2)} zł <small style="font-size:13px;color:#64748b">netto</small> <span style="font-size:13px;color:#64748b;font-weight:400">${Number(p.price_gross).toFixed(2)} zł brutto • VAT ${p.vat_rate}%</span></div>
              <div style="margin-top:8px;display:inline-flex;padding:4px 10px;background:#eef2ff;border:1px solid #e0e7ff;color:#4338ca;border-radius:999px;font-size:12px">Pack ${p.pack_size} • Podane ceny są netto</div>
              <p style="margin-top:8px;font-size:13px;color:${out?'#ef4444':'#10b981'}">${out?'Brak w magazynie': p.stock_quantity+' paczek dostępnych • '+p.stock_status}</p>
            </div>
            ${variants.length?`<div style="margin-top:16px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px"><h3 style="font-weight:600">Warianty</h3><div style="margin-top:8px;display:grid;gap:8px">${variants.map(v=>`<label style="display:flex;gap:8px;align-items:center;padding:8px;border:1px solid #e2e8f0;border-radius:12px;cursor:pointer"><input type="radio" name="var" value="${v.id}" data-price="${v.price_net_override||p.price_net}" data-label="${v.option_name}: ${v.option_value} (${v.sku})"> <span style="font-size:13px">${v.option_name}: <b>${v.option_value}</b> — ${v.sku}</span><span style="margin-left:auto;font-size:12px;color:#64748b">${v.price_net_override? v.price_net_override+' netto' : p.price_net+' netto'} • ${v.stock_quantity} packs</span></label>`).join('')}<label style="display:flex;gap:8px;align-items:center;padding:8px;border:1px solid #e2e8f0;border-radius:12px;cursor:pointer"><input type="radio" name="var" value="" checked> <span style="font-size:13px">Bez wariantu — produkt podstawowy</span></label></div></div>`:''}
            <div style="margin-top:16px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px">
              <label style="font-size:14px;font-weight:500">Ilość — packi</label>
              <div style="display:flex;gap:12px;margin-top:8px">
                <div class="qty"><button type="button" onclick="chg(-1)">−</button><input id="qty" type="number" value="1" min="1"><button type="button" onclick="chg(1)">+</button></div>
                <button id="addBtn" class="add" style="flex:1" ${out?'disabled':''}>Dodaj do koszyka</button>
              </div>
              <p style="font-size:11px;color:#94a3b8;margin-top:8px">Kupujesz packi, nie sztuki. ${p.pack_size} szt. w packu</p>
            </div>
            ${p.description?`<div style="margin-top:16px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px"><h3 style="font-weight:600">Opis</h3><p style="font-size:14px;color:#334155;white-space:pre-wrap;margin-top:8px">${p.description}</p></div>`:''}
          </div>
        </div>
      </div>
    `;
    window._prod = p;
    document.getElementById('addBtn').addEventListener('click', ()=>{
      const qty = Math.max(1, parseInt(document.getElementById('qty').value||'1',10));
      const sel = document.querySelector('input[name=var]:checked');
      const varId = sel && sel.value ? sel.value : null;
      const varLabel = sel && sel.value ? sel.dataset.label : null;
      const varPrice = sel && sel.value ? parseFloat(sel.dataset.price) : null;
      Cart.addToCart(p, qty, varId, varLabel, varPrice);
      location.href='cart.html';
    });
    window.chg=(d)=>{ const el=document.getElementById('qty'); let v=parseInt(el.value||'1',10)+d; if(v<1) v=1; el.value=v; };
  }catch(e){
    document.getElementById('content').innerHTML='<p style="color:#ef4444">'+e.message+'</p><a href="categories.html">← Kategorie</a>';
  }
}
function chg(d){ const el=document.getElementById('qty'); let v=parseInt(el.value||'1',10)+d; if(v<1) v=1; el.value=v; }
load();
</script>
</body></html>
