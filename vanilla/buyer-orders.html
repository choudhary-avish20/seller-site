<!doctype html>
<html lang="pl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Moje zamówienia — Wholesale</title><link rel="stylesheet" href="css/style.css"/></head>
<body>
<div id="site-header"></div>
<div class="container" style="padding:24px 16px;max-width:900px">
<h1 style="font-size:24px;font-weight:800">Moje zamówienia</h1>
<p style="color:#64748b;font-size:13px">Zamówienia w packach • COD • statusy oczekujące → dostarczone</p>
<div id="orders" style="margin-top:16px"></div>
</div>
<div id="site-footer"></div>
<script src="js/api.js"></script><script src="js/common.js"></script>
<script>
async function load(){
  const tree=await Api.getCategoryTree(false).catch(()=>[]);
  injectHeader(tree); injectFooter();
  try{
    const orders=await Api.listOrders();
    if(!orders.length){ document.getElementById('orders').innerHTML='<div style="padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;text-align:center"><p> brak zamówień </p><a href="categories.html" class="btn btn--dark" style="margin-top:12px;display:inline-block">Przeglądaj produkty →</a></div>'; return; }
    document.getElementById('orders').innerHTML=orders.map(o=>`
      <div style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:12px">
        <div style="display:flex;justify-content:space-between"><b>Zamówienie #${o.id.slice(0,8)}</b><span class="badge ${o.status==='pending'?'badge--yellow': o.status==='cancelled'?'badge--red':'badge--green'}">${o.status}</span></div>
        <p style="font-size:12px;color:#64748b">${new Date(o.created_at).toLocaleString()} • Brutto ${Number(o.total_gross).toFixed(2)} zł</p>
        <p style="font-size:12px;color:#64748b">Wysyłka: ${o.shipping_address}</p>
        <div style="margin-top:8px;border-top:1px solid #f1f5f9;padding-top:8px">${o.items.map(it=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span>${it.product_name_snapshot} (pack ${it.pack_size_snapshot}) × ${it.pack_quantity}</span><span>${(it.price_gross_snapshot*it.pack_quantity).toFixed(2)} zł</span></div>`).join('')}</div>
      </div>
    `).join('');
  }catch(e){
    document.getElementById('orders').innerHTML='<p style="color:#ef4444">'+e.message+' — <a href="login.html">Zaloguj jako kupujący</a></p>';
  }
}
load();
</script>
</body></html>
