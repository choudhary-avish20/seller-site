<!doctype html>
<html lang="pl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Kategoria — Wholesale</title><link rel="stylesheet" href="css/style.css"/></head>
<body>
<div id="site-header"></div>
<div class="container" style="padding:24px 16px">
<div id="breadcrumb" style="font-size:13px;color:#64748b;margin-bottom:12px"></div>
<div class="layout">
<aside class="sidebar"><div class="sidebar__card"><div class="sidebar__head"><span class="sidebar__title">Kategorie hurtowni</span></div><div class="sidebar__body" id="sidebar"></div></div></aside>
<main style="flex:1">
<h1 id="catTitle" style="font-size:24px;font-weight:800"></h1>
<p id="catDesc" style="color:#64748b;font-size:13px">Ceny pack • netto/brutto • VAT wliczony</p>
<div id="subs" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px"></div>
<div id="prods" class="grid3" style="margin-top:16px"></div>
</main>
</div>
</div>
<div id="site-footer"></div>
<script src="js/api.js"></script><script src="js/cart.js"></script><script src="js/common.js"></script>
<script>
async function load(){
  const slug=new URLSearchParams(location.search).get('slug');
  if(!slug){ location.href='categories.html'; return; }
  const [tree] = await Promise.all([Api.getCategoryTree(false).catch(()=>[])]);
  injectHeader(tree); injectFooter();
  // sidebar
  document.getElementById('sidebar').innerHTML = tree.map(n=>`<a href="category.html?slug=${n.slug}" class="side-link ${n.slug===slug?'active':''}">${n.name}</a>` + n.children.map(c=>`<a href="category.html?slug=${c.slug}" class="side-link ${c.slug===slug?'active':''}" style="padding-left:24px;font-size:13px">${c.name}</a>`).join('')).join('');
  try{
    const cat = await Api.getCategoryBySlug(slug);
    document.getElementById('catTitle').textContent=cat.name;
    document.getElementById('breadcrumb').innerHTML=`<a href="categories.html">Kategorie</a> / <span style="color:#0f172a;font-weight:600">${cat.name}</span>`;
    // find node for subs
    function find(nodes, slug){
      for(let n of nodes){ if(n.slug===slug) return n; let r=find(n.children, slug); if(r) return r; } return null;
    }
    const node=find(tree, slug);
    if(node && node.children.length){
      document.getElementById('subs').innerHTML=node.children.map(s=>`<a href="category.html?slug=${s.slug}" style="padding:6px 12px;background:#fff;border:1px solid #e2e8f0;border-radius:999px;font-size:12px">${s.name}</a>`).join('');
    }
    // products for this category + descendants
    const ids=new Set();
    function collect(n){ ids.add(n.id); n.children.forEach(collect); }
    if(node) collect(node); else ids.add(cat.id);
    const all = await Api.listProducts({limit:100});
    const filtered = all.filter(p=> ids.has(p.category_id));
    const el=document.getElementById('prods');
    if(!filtered.length) el.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:16px">Brak produktów w tej kategorii.</p>';
    else el.innerHTML=filtered.map(p=>{
      const out=p.stock_status==='out_of_stock'||p.stock_quantity===0;
      const img=p.images&&p.images[0]?getImageUrl(p.images[0]):'';
      return `<div class="product"><a href="product.html?slug=${p.slug}" style="display:block;background:#f8fafc;aspect-ratio:4/3">${img?`<img src="${img}" style="width:100%;height:100%;object-fit:cover">`:`<div style="display:grid;place-items:center;height:100%;color:#94a3b8">No image</div>`}</a><div style="padding:16px"><a href="product.html?slug=${p.slug}" style="font-size:13px;font-weight:500">${p.name}</a><div style="font-size:18px;font-weight:800;color:#4338ca">${Number(p.price_net).toFixed(2)} zł <small style="font-size:11px;color:#64748b">netto</small></div><button class="add" style="margin-top:8px;width:100%" onclick='Cart.addToCart({id:"${p.id}",slug:"${p.slug}",name:"${p.name}",price_net:${p.price_net},price_gross:${p.price_gross},vat_rate:${p.vat_rate},pack_size:${p.pack_size},stock_status:"${p.stock_status}",stock_quantity:${p.stock_quantity},images:${JSON.stringify(p.images)}},1);alert("Dodano")' ${out?'disabled':''}>Dodaj</button></div></div>`;
    }).join('');
  }catch(e){
    document.getElementById('catTitle').textContent='Nie znaleziono kategorii';
  }
}
load();
</script>
</body></html>
