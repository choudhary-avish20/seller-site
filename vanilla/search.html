<!doctype html>
<html lang="pl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Szukaj — Wholesale</title><link rel="stylesheet" href="css/style.css"/></head>
<body>
<div id="site-header"></div>
<div class="container" style="padding:24px 16px;display:flex;gap:24px;flex-direction:column">
<div class="layout">
<aside class="sidebar"><div class="sidebar__card"><div class="sidebar__head"><span class="sidebar__title">Kategorie hurtowni</span></div><div class="sidebar__body" id="sidebar"></div></div></aside>
<main style="flex:1">
<h1 id="title" style="font-size:24px;font-weight:800">Wszystkie produkty</h1>
<p style="color:#64748b;font-size:14px">Szukaj po nazwie, opisie, kategorii — proste ILIKE (gotowe na full-text Postgres).</p>
<div id="results" style="margin-top:16px" class="grid3"></div>
</main>
</div>
</div>
<div id="site-footer"></div>
<script src="js/api.js"></script><script src="js/i18n.js"></script><script src="js/cart.js"></script><script src="js/common.js"></script>
<script>
async function load(){
  const q=new URLSearchParams(location.search).get('q')||'';
  const [tree, prods] = await Promise.all([Api.getCategoryTree(false).catch(()=>[]), q? Api.listProducts({search:q,limit:50}).catch(()=>[]) : Api.listProducts({limit:24}).catch(()=>[])]);
  injectHeader(tree); injectFooter();
  document.getElementById('sidebar').innerHTML=`<a href="categories.html" class="side-link">Wszystkie produkty</a>`+tree.map(n=>`<a href="category.html?slug=${n.slug}" class="side-link">${n.name}</a>`).join('');
  document.getElementById('title').textContent = q? `Szukaj: “${q}”` : 'Wszystkie produkty';
  const el=document.getElementById('results');
  if(!prods.length) el.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:16px">Brak produktów</p>';
  else el.innerHTML=prods.map(p=>`
    <div class="product"><a href="product.html?slug=${p.slug}" style="display:block;background:#f8fafc;aspect-ratio:4/3"><img src="${getImageUrl(p.images[0]||'')}" style="width:100%;height:100%;object-fit:cover"></a><div style="padding:16px"><a href="product.html?slug=${p.slug}" style="font-size:13px;font-weight:500">${p.name}</a><div style="font-size:18px;font-weight:800;color:#4338ca">${Number(p.price_net).toFixed(2)} zł <small style="font-size:11px;color:#64748b">netto</small></div><button class="add" style="margin-top:8px;width:100%" onclick='Cart.addToCart({id:"${p.id}",slug:"${p.slug}",name:"${p.name}",price_net:${p.price_net},price_gross:${p.price_gross},vat_rate:${p.vat_rate},pack_size:${p.pack_size},stock_status:"${p.stock_status}",stock_quantity:${p.stock_quantity},images:${JSON.stringify(p.images)}},1);alert("Dodano")'>Dodaj</button></div></div>
  `).join('');
}
load();
</script>
</body></html>
