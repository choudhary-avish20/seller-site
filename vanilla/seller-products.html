<!doctype html>
<html lang="pl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Moje produkty — Wholesale</title><link rel="stylesheet" href="css/style.css"/></head>
<body>
<div id="site-header"></div>
<div class="container" style="padding:24px 16px">
<div style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-size:24px;font-weight:800">Moje produkty</h1><a href="seller-product-new.html" class="btn btn--dark">+ Dodaj produkt</a></div>
<div id="list" style="margin-top:16px"></div>
</div>
<div id="site-footer"></div>
<script src="js/api.js"></script><script src="js/cart.js"></script><script src="js/common.js"></script>
<script>
async function load(){
  const tree=await Api.getCategoryTree(false).catch(()=>[]);
  injectHeader(tree); injectFooter();
  try{
    const prods=await Api.listMyProducts();
    if(!prods.length){ document.getElementById('list').innerHTML='<div style="padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;text-align:center"><p>Brak produktów.</p><a href="seller-product-new.html" class="btn btn--dark" style="margin-top:12px;display:inline-block">Dodaj produkt</a></div>'; return; }
    document.getElementById('list').innerHTML='<div class="table-wrap"><table><thead><tr><th>Produkt</th><th>Kategoria</th><th>Pack i cena</th><th>Stan</th><th>Akcje</th></tr></thead><tbody>'+prods.map(p=>`
      <tr>
        <td><div style="display:flex;gap:8px;align-items:center"><img src="${getImageUrl(p.images[0]||'')}" style="width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0"><div><div style="font-weight:600">${p.name}</div><div style="font-size:11px;color:#94a3b8">/${p.slug}</div></div></div></td>
        <td>${p.category_name||''}</td>
        <td>Pack ${p.pack_size}<br><small>${Number(p.price_net).toFixed(2)} netto • ${Number(p.price_gross).toFixed(2)} brutto</small></td>
        <td><span class="badge ${p.stock_status==='in_stock'?'badge--green':'badge--red'}">${p.stock_status}</span><br><small>${p.stock_quantity} packs</small><br><button onclick="toggleStock('${p.id}','${p.stock_status}')" style="font-size:11px;color:#4f46e5">Zmień stan</button></td>
        <td><a href="product.html?slug=${p.slug}" style="font-size:12px;color:#4f46e5">Zobacz</a> • <button onclick="archiveProd('${p.id}')" style="font-size:12px;color:#64748b;background:none;border:0;cursor:pointer">${p.is_active?'Archiwizuj':'Przywróć'}</button> • <button onclick="delProd('${p.id}')" style="font-size:12px;color:#ef4444;background:none;border:0;cursor:pointer">Usuń</button></td>
      </tr>
    `).join('')+'</tbody></table></div>';
  }catch(e){
    document.getElementById('list').innerHTML='<p style="color:#ef4444">'+e.message+' — <a href="login.html">Zaloguj jako sprzedawca</a></p>';
  }
}
async function delProd(id){ if(!confirm('Usunąć?')) return; await Api.deleteProduct(id); load(); }
async function archiveProd(id){ await Api.archiveProduct(id); load(); }
async function toggleStock(id,status){ const ns=status==='in_stock'?'out_of_stock':'in_stock'; await Api.toggleStock(id,{stock_status:ns}); load(); }
load();
</script>
</body></html>
