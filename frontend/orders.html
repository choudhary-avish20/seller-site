<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moje zamówienia — WolkaGo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:12px}
.order-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface-muted);border-bottom:1px solid var(--border);font-size:12px}
.order-body{padding:12px 14px}
.order-item{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)}
.order-item:last-child{border-bottom:0}
/* .status-badge / .status-* are shared with the admin dashboard's orders
   table — defined once in css/style.css so both surfaces show the same
   status in the same color. */
.otl{display:flex;align-items:flex-start;margin:4px 0 14px}
.otl-step{flex:1;text-align:center;position:relative;font-size:10px;color:#999}
.otl-line{position:absolute;top:11px;left:-50%;right:50%;height:2px;background:#e5e7eb;z-index:0}
.otl-line.done{background:var(--success)}
.otl-step:first-child .otl-line{display:none}
.otl-dot{width:22px;height:22px;border-radius:50%;background:var(--border-strong);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-size:11px;font-weight:bold;position:relative;z-index:1}
.otl-dot.done{background:var(--success)}
.otl-dot.current{background:var(--accent)}
.cancelled-note{background:var(--surface-muted);color:var(--muted);padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;text-align:center;margin:4px 0 14px}

/* Order-card action row — one shared button style (outline pill) with an
   accent/danger/neutral color variant, instead of each button hand-coding
   its own border color. */
.oa-actions{margin-top:10px;text-align:right;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.oa-btn{font-size:11px;font-weight:600;background:none;border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;transition:background var(--t-fast)}
.oa-btn.accent{color:var(--accent);border:1px solid var(--accent-soft)}
.oa-btn.accent:hover{background:var(--accent-soft)}
.oa-btn.danger{color:var(--sale);border:1px solid #fca5a5}
.oa-btn.danger:hover{background:#fef2f2}
.oa-btn.neutral{color:var(--muted);border:1px solid var(--border)}
.oa-btn.neutral:hover{background:var(--surface-muted)}
</style>
</head>
<body>
<div class="topbar"><div class="container">
  <a href="contact.html" class="topbar-contact"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg><span data-i18n="contact">Kontakt z nami</span></a>
</div></div>
<div class="header"><div class="container">
  <a href="index.html" class="logo"><img src="assets/wolkago-logo.png" alt="WolkaGo"></a>
  <div style="flex:1"></div>
  <div class="header-actions">
    <div id="wishlistMenuSlot"></div>
    <a href="cart.html" class="cart" aria-label="Koszyk">
      <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <span class="cart-copy">
        <span class="cart-label">Koszyk (<b data-cart-count>0</b>)</span>
        <span class="cart-total" data-cart-net>0.00 zł</span>
      </span>
    </a>
    <div id="accountMenuSlot"></div>
  </div>
</div></div>
<div id="catnavSlot"></div>

<div class="container page-pad">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;flex-wrap:wrap;gap:8px">
    <h1 style="font-size:16px;margin:0">Moje zamówienia</h1>
    <button id="clearCancelledBtn" class="oa-btn danger" onclick="clearAllCancelled()" style="display:none">🗑 Wyczyść anulowane</button>
  </div>
  <div id="list"></div>
</div>

<div id="site-footer"></div>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
const STATUS_LABELS = {pending:'Oczekujące', confirmed:'Potwierdzone', shipped:'Wysłane', out_for_delivery:'W dostawie', delivered:'Zrealizowane', cancelled:'Anulowane'};
const ORDER_STEPS = [
  {key:'pending', label:'Złożone', icon:'📝'},
  {key:'confirmed', label:'Potwierdzone', icon:'✅'},
  {key:'shipped', label:'Wysłane', icon:'🚚'},
  {key:'out_for_delivery', label:'W dostawie', icon:'🛵'},
  {key:'delivered', label:'Dostarczone', icon:'📦'},
];
function renderTimeline(status){
  if(status === 'cancelled') return `<div class="cancelled-note">✕ Zamówienie anulowane</div>`;
  const idx = ORDER_STEPS.findIndex(s=>s.key===status);
  return `<div class="otl">` + ORDER_STEPS.map((s,i)=>{
    const done = i < idx, current = i === idx;
    return `<div class="otl-step">
      <div class="otl-line ${i<=idx?'done':''}"></div>
      <div class="otl-dot ${done?'done':''} ${current?'current':''}">${done?'✓':s.icon}</div>
      <div style="${current?'font-weight:bold;color:var(--accent)':''}">${s.label}</div>
    </div>`;
  }).join('') + `</div>`;
}

async function load(){
  const tok = localStorage.getItem('access_token');
  if(!tok){ location.href = 'login.html?next=orders.html'; return; }

  const list = document.getElementById('list');
  list.innerHTML = '<p style="text-align:center;padding:20px;color:var(--muted)">Ładowanie…</p>';

  let orders;
  try { orders = await Api.listOrders(); }
  catch(e){ list.innerHTML = `<p style="color:var(--sale);text-align:center;padding:20px">${esc(e.message)}</p>`; return; }

  if(!orders.length){
    list.innerHTML = '<p style="padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);text-align:center">Nie masz jeszcze żadnych zamówień — <a href="index.html" style="color:var(--accent)">przeglądaj produkty</a></p>';
    return;
  }

  orders.sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
  window._ordersCache = orders;

  const cancelledCount = orders.filter(o=>o.status==='cancelled').length;
  document.getElementById('clearCancelledBtn').style.display = cancelledCount > 1 ? 'inline-block' : 'none';

  list.innerHTML = orders.map(o=>{
    const d = new Date(o.created_at).toLocaleString('pl-PL', {dateStyle:'medium', timeStyle:'short'});
    const items = (o.items||[]).map(it=>`
      <div class="order-item">
        <span>${esc(it.product_name_snapshot)} × ${it.pack_quantity} paczek${it.buyer_note ? `<br><span style="font-size:11px;color:#7c3aed;font-style:italic">📝 ${esc(it.buyer_note)}</span>` : ''}</span>
        <b>${(Number(it.price_gross_snapshot)*it.pack_quantity*it.pack_size_snapshot).toFixed(2)} zł</b>
      </div>`).join('');
    const canCancel = o.status === 'pending' || o.status === 'confirmed';
    return `
      <div class="order-card">
        <div class="order-head">
          <div>Nr <b style="font-family:monospace">${esc(o.id.split('-')[0].toUpperCase())}</b> • ${d}</div>
          <span class="status-badge status-${esc(o.status)}">${STATUS_LABELS[o.status] || esc(o.status)}</span>
        </div>
        <div class="order-body">
          ${renderTimeline(o.status)}
          ${items}
          ${o.notes ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid #eee;font-size:12px;color:#92400e"><b>🚚 Uwagi do zamówienia/dostawy:</b> ${esc(o.notes)}</div>` : ''}
          ${o.coupon_code && Number(o.discount_amount) > 0 ? `<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid #eee;color:#1a7f37;font-size:13px">
            <span>Kupon ${esc(o.coupon_code)}</span><span>-${Number(o.discount_amount).toFixed(2)} zł</span>
          </div>` : ''}
          <div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid #eee;font-weight:bold">
            <span>Razem brutto</span><span>${Number(o.total_gross).toFixed(2)} zł</span>
          </div>
          <div class="oa-actions">
            <button class="oa-btn accent" onclick="reorderAll('${o.id}')">↻ Zamów ponownie</button>
            ${canCancel ? `<button class="oa-btn danger" onclick="cancelOrder('${o.id}')">Anuluj zamówienie</button>` : ''}
            ${o.status === 'cancelled' ? `<button class="oa-btn neutral" onclick="hideOrder('${o.id}')">🗑 Usuń z listy</button>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

async function cancelOrder(id){
  if(!confirm('Na pewno anulować to zamówienie?')) return;
  try{
    await Api.updateOrderStatus(id, 'cancelled');
    load();
  }catch(e){
    alert('Nie udało się anulować zamówienia: '+e.message);
  }
}

async function hideOrder(id){
  if(!confirm('Usunąć to zamówienie z listy? Zostanie zachowane w naszych rejestrach, ale zniknie z Twojego widoku.')) return;
  try{
    await Api.hideOrder(id);
    load();
  }catch(e){
    alert('Nie udało się usunąć zamówienia z listy: '+e.message);
  }
}

async function clearAllCancelled(){
  const cancelled = (window._ordersCache||[]).filter(o=>o.status==='cancelled');
  if(!cancelled.length) return;
  if(!confirm(`Usunąć ${cancelled.length} anulowanych zamówień z listy? Zostaną zachowane w naszych rejestrach.`)) return;
  await Promise.all(cancelled.map(o=>Api.hideOrder(o.id).catch(()=>{})));
  load();
}

async function reorderAll(orderId){
  const order = (window._ordersCache||[]).find(o=>o.id===orderId);
  if(!order) return;
  let added = 0, skipped = 0;
  for(const it of (order.items||[])){
    try{
      const p = await Api.getProductById(it.product_id);
      if(!p.is_active){ skipped++; continue; }
      Cart.add(p, it.pack_quantity);
      added++;
    }catch{ skipped++; }
  }
  if(added){
    alert(`Dodano ${added} produkt${added>1?'y':''} do koszyka.` + (skipped?` (${skipped} niedostępnych pominięto)`:''));
    location.href = 'cart.html';
  } else {
    alert('Nie udało się dodać żadnego produktu — mogły zostać usunięte lub zarchiwizowane.');
  }
}

load();
</script>
</body>
</html>
