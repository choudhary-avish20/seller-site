<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAQ — WolkaGo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.faq-wrap{max-width:760px;margin:30px auto;padding:0 10px}
.faq-item{background:#fff;border:1px solid #ddd;margin-bottom:8px}
.faq-q{padding:14px 16px;font-weight:bold;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.faq-q:hover{background:#fafafa}
.faq-a{padding:0 16px;max-height:0;overflow:hidden;transition:max-height .2s ease,padding .2s ease;font-size:13px;color:#555;line-height:1.6}
.faq-item.open .faq-a{padding:0 16px 14px;max-height:400px}
.faq-item.open .faq-q .arrow{transform:rotate(180deg)}
.faq-q .arrow{transition:transform .2s;color:#888;flex-shrink:0}
</style>
</head>
<body>
<div class="topbar"><div class="container">
  <a href="index.html">Strona główna</a>
  <a href="contact.html" class="topbar-contact"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg><span data-i18n="contact">Kontakt z nami</span></a>
</div></div>

<div class="header"><div class="container">
  <a href="index.html" class="logo"><img src="assets/wolkago-logo.png" alt="WolkaGo"></a>
  <div style="flex:1"></div>
  <div class="header-actions">
    <div id="wishlistMenuSlot"></div>
    <a href="cart.html" class="cart" aria-label="Koszyk">
      <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <span class="cart-copy">
        <span class="cart-label">Koszyk (<b data-cart-count>0</b>)</span>
        <span class="cart-total" data-cart-net>0.00 zł</span>
      </span>
    </a>
    <div id="accountMenuSlot"></div>
  </div>
</div></div>

<div class="faq-wrap">
  <h1 style="font-size:20px;margin-bottom:14px">Najczęściej zadawane pytania</h1>
  <div id="faqBody"><p style="text-align:center;color:#888;padding:20px">Ładowanie…</p></div>
</div>

<div id="site-footer"></div>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
function toggleFaq(el){
  el.classList.toggle('open');
}

async function loadContent(){
  const el = document.getElementById('faqBody');
  let raw;
  try{
    const s = await Api.getSettings();
    raw = s.faq_content;
  }catch(e){
    el.innerHTML = '<p style="color:red;text-align:center;padding:20px">Nie udało się załadować treści.</p>';
    return;
  }
  if(!raw){ el.innerHTML = '<p style="text-align:center;color:#888;padding:20px">FAQ zostanie wkrótce opublikowane.</p>'; return; }

  // Content is plain text: blocks separated by a blank line, first line of
  // each block is the question, the rest is the answer. Falls back to
  // showing the whole thing as one block if it doesn't parse cleanly.
  const blocks = raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const items = blocks.slice(1).map(block=>{
    const lines = block.split('\n');
    const q = lines[0];
    const a = lines.slice(1).join(' ');
    return {q, a};
  }).filter(it=>it.q && it.a);

  if(!items.length){
    el.innerHTML = `<div class="faq-item open" style="white-space:pre-wrap;padding:16px">${esc(raw)}</div>`;
    return;
  }

  el.innerHTML = items.map(it=>`
    <div class="faq-item">
      <div class="faq-q" onclick="toggleFaq(this.parentElement)"><span>${esc(it.q)}</span><span class="arrow">▾</span></div>
      <div class="faq-a">${esc(it.a)}</div>
    </div>`).join('');
}
loadContent();
</script>
</body>
</html>
