<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moja lista życzeń — WolkaGo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">
<link rel="stylesheet" href="css/style.css">
<style>
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:14px}
.wl-card{background:#fff;border:1px solid #ddd;position:relative}
.wl-card img{width:100%;height:160px;object-fit:contain;background:#fafafa;display:block}
.wl-card .body{padding:10px}
.wl-card h3{font-size:12px;font-weight:bold;margin:0 0 6px;line-height:1.3}
.wl-card h3 a{color:#222}
.wl-remove{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:1px solid #ddd;background:#fff;color:#c00;cursor:pointer;z-index:2}
.wl-remove:hover{background:#fef2f2;border-color:#fca5a5}
</style>
</head>
<body>
<div class="topbar"><div class="container">
  <div>Skontaktuj się z nami: <b>+48 579 383 945</b></div>
  <div style="display:flex;gap:12px;align-items:center">
    <a href="index.html">Sklep</a>
    <a href="login.html" id="top-login" data-i18n="login">Zaloguj się</a>
  </div>
</div></div>
<div class="header"><div class="container">
  <a href="index.html" class="logo"><img src="assets/wolkago-logo.png" alt="WolkaGo"></a>
  <div style="flex:1"></div>
  <a href="cart.html" class="cart">Koszyk <b data-cart-count>0</b></a>
</div></div>

<div class="container" style="padding:16px 10px">
  <h1 style="font-size:16px;margin:0 0 12px">♥ Moja lista życzeń</h1>
  <div id="list"></div>
</div>

<div id="site-footer"></div>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
async function load(){
  const tok = localStorage.getItem('access_token');
  if(!tok){ location.href = 'login.html?next=wishlist.html'; return; }

  const list = document.getElementById('list');
  list.innerHTML = '<p style="text-align:center;padding:20px;color:#888">Ładowanie…</p>';

  let items;
  try { items = await Api.getWishlist(); }
  catch(e){ list.innerHTML = `<p style="color:red;text-align:center;padding:20px">${esc(e.message)}</p>`; return; }

  if(!items.length){
    list.innerHTML = '<p style="padding:30px;background:#fff;border:1px solid #ddd;text-align:center">Twoja lista życzeń jest pusta — <a href="index.html" style="color:#06c">przeglądaj produkty</a> i zapisz to, co Cię interesuje.</p>';
    return;
  }

  list.innerHTML = `<div class="wl-grid">${items.map(it=>{
    const p = it.product;
    const img = p.images && p.images[0] ? Api.img(p.images[0]) : 'https://via.placeholder.com/300x220?text=No+image';
    const slugUrl = encodeURIComponent(p.slug);
    const out = p.stock_status==='out_of_stock' || p.stock_quantity===0;
    return `
      <div class="wl-card">
        <button class="wl-remove" onclick="removeItem('${p.id}')" title="Usuń z listy życzeń">✕</button>
        <a href="product.html?slug=${slugUrl}"><img src="${esc(img)}" alt="${esc(p.name)}"></a>
        <div class="body">
          <h3><a href="product.html?slug=${slugUrl}">${esc(p.name)}</a></h3>
          <div style="font-size:12px;margin-bottom:8px"><b>${Number(p.price_net).toFixed(2)} PLN</b> netto</div>
          <button class="add" style="width:100%" onclick="addToCartFromWishlist('${p.id}')" ${out?'disabled style="opacity:.5"':''}>${out?'Niedostępny':'Dodaj do koszyka'}</button>
        </div>
      </div>`;
  }).join('')}</div>`;
  window._wlProducts = items.map(it=>it.product);
}

async function removeItem(productId){
  try{
    await Api.removeFromWishlist(productId);
    if(Wishlist._ids) Wishlist._ids.delete(productId);
    load();
  }catch(e){
    alert('Nie udało się usunąć produktu: '+e.message);
  }
}

function addToCartFromWishlist(productId){
  const p = (window._wlProducts||[]).find(x=>x.id===productId);
  if(!p) return;
  Cart.add(p, p.pack_increment||1);
  alert('Dodano do koszyka: '+p.name);
}

load();
</script>
</body>
</html>
