<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search results — WolkaGo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar"><div class="container">
  <a href="contact.html" class="topbar-contact"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg><span data-i18n="contact">Kontakt z nami</span></a>
</div></div>

<div class="header"><div class="container">
  <a href="index.html" class="logo"><img src="assets/wolkago-logo.png" alt="WolkaGo"></a>
  <form class="search" id="searchForm">
    <input id="q" data-i18n-ph="searchPh" placeholder="Szukaj — nazwa produktu, kategoria...">
    <button type="submit" data-i18n="search">Szukaj</button>
  </form>
  <div class="header-actions">
    <div id="wishlistMenuSlot"></div>
    <a href="cart.html" class="cart" aria-label="Koszyk">
      <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <span class="cart-copy">
        <span class="cart-label">Koszyk (<b data-cart-count>0</b>)</span>
        <span class="cart-total" data-cart-net>0.00 zł</span>
      </span>
    </a>
    <div id="accountMenuSlot"></div>
  </div>
</div></div>

<div class="container" style="padding:24px 16px">
  <h1 id="heading" style="font-size:18px;font-weight:700;margin:0 0 20px;color:var(--text-primary)"></h1>
  <div class="grid" id="grid"></div>
</div>

<div id="site-footer"></div>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
async function runSearch(){
  const q = new URLSearchParams(location.search).get('q') || '';
  document.getElementById('q').value = q;
  document.getElementById('heading').textContent = q
    ? `Wyniki wyszukiwania dla „${q}”`
    : 'Wpisz szukaną frazę powyżej';

  const grid = document.getElementById('grid');
  if(!q){ grid.innerHTML=''; return; }

  grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Ładowanie…</p>';
  const prods = await Api.listProducts({search:q, limit:48}).catch(()=>[]);

  if(!prods.length){
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)">Brak wyników.</p>';
    return;
  }

  grid.innerHTML = prods.map(renderProductCard).join('');
  refreshWishlistHearts();
}

document.getElementById('searchForm').addEventListener('submit', e=>{
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  location.href = q ? 'search.html?q='+encodeURIComponent(q) : 'search.html';
});

runSearch();
</script>
</body>
</html>
