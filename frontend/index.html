<body>
<!-- Topbar -->

</div></div>

<div class="catnav"><div class="container">

</div></div>

<div class="container layout">
  <aside class="sidebar">
    <div class="sidebar-head">Kategorie</div>
    <div class="cat-list" id="catList"></div>
  </aside>
  <main class="main">
    <div class="tabs">
      <div class="tab active" data-filter="new" data-i18n="new" onclick="selectTab('new',this)">NEWS</div>
      <div class="tab" data-filter="popular" onclick="selectTab('popular',this)">POPULAR</div>
      <div class="tab" data-filter="bestseller" onclick="selectTab('bestseller',this)">BESTSELLERS</div>
      <div class="tab" data-filter="sale" onclick="selectTab('sale',this)">PROMOTIONS</div>
    </div>

    <div id="catHeading" style="font-size:13px;font-weight:bold;color:#333;margin-bottom:8px;min-height:18px"></div>
    <div class="grid" id="grid"></div>
    <div id="loadMoreWrap" style="text-align:center;margin-top:16px;display:none">
      <button id="loadMoreBtn" onclick="loadMore()" style="padding:9px 28px;background:#fff;border:1px solid var(--accent);color:var(--accent);font-weight:bold;cursor:pointer">Load more</button>
    </div>
    <div id="recentlyViewedSection" style="display:none;margin-top:24px">
      <div style="font-size:13px;font-weight:bold;color:#333;margin-bottom:8px">Ostatnio oglądane</div>
      <div class="grid" id="recentlyViewedGrid"></div>
    </div>
  </main>
</div>

<div id="site-footer"></div>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
const catNamesById = {};
async function loadCats(){
  const tree=await Api.getCategoryTree().catch(()=>[]);
  const el=document.getElementById('catList');

  function row(n, depth=0){
    catNamesById[n.id] = n.name;
    const pad = depth * 10;
    const hasChildren = n.children && n.children.length;
    let h = `<div class="cat-item" style="padding-left:${8+pad}px"
      onclick="selectCat('${n.id}', event, ${hasChildren})"
      data-cat-id="${n.id}"
      id="cat-${n.id}">
        <span>${esc(n.name)}</span>
        ${hasChildren ? `<span class="plus" data-toggle>+</span>` : ''}
      </div>`;
    if(hasChildren){
      h += `<div class="sub">${n.children.map(c=>row(c, depth+1)).join('')}</div>`;
    }
    return h;
  }

  el.innerHTML = `<div class="cat-item" id="cat-all" onclick="selectCat(null,event,false)" style="font-style:italic;color:var(--accent);border-bottom:2px solid var(--accent)">
    <span>Wszystkie produkty</span>
  </div>` + (tree.map(n=>row(n)).join('') || '<div style="padding:8px;font-size:11px;color:#888">No categories — admin at /admin</div>');
}

function selectCat(id, event, hasChildren){
  const name = id ? (catNamesById[id] || '') : 'Wszystkie produkty';
  // If the click was on the +/− toggle, only expand — don't filter
  if(event && event.target.dataset.toggle !== undefined){
    const sub = event.currentTarget.nextElementSibling;
    if(sub && sub.classList.contains('sub')){
      sub.classList.toggle('open');
      event.target.textContent = sub.classList.contains('open') ? '−' : '+';
    }
    return;
  }

  // If has children: expand AND filter simultaneously
  if(hasChildren){
    const sub = event.currentTarget.nextElementSibling;
    if(sub && sub.classList.contains('sub')){
      sub.classList.toggle('open');
      const toggle = event.currentTarget.querySelector('[data-toggle]');
      if(toggle) toggle.textContent = sub.classList.contains('open') ? '−' : '+';
    }
  }

  // Highlight active
  document.querySelectorAll('.cat-item').forEach(el=>{
    el.style.background='';
    el.style.borderLeft='3px solid transparent';
    el.style.color='';
    el.style.fontWeight='';
  });
  const active = id ? document.getElementById('cat-'+id) : document.getElementById('cat-all');
  if(active){
    active.style.background='var(--accent-soft)';
    active.style.borderLeft='3px solid var(--accent)';
    active.style.color='var(--accent)';
    active.style.fontWeight='bold';
  }

  // Update heading and load products
  const heading = document.getElementById('catHeading');
  if(heading) heading.textContent = name;

  loadProducts(id);
}
let currentFilter='new';
let currentCategoryId=null;
let currentPage=1;
const PAGE_SIZE=32;

function selectTab(filter, el){
  currentFilter=filter;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el) el.classList.add('active');
  loadProducts(currentCategoryId);
}

function loadMore(){
  currentPage++;
  loadProducts(currentCategoryId, {append:true});
}

async function loadProducts(categoryId, opts={}){
  const append = !!opts.append;
  currentCategoryId = categoryId || null;
  if(!append) currentPage = 1;
  const grid=document.getElementById('grid');
  const loadMoreWrap=document.getElementById('loadMoreWrap');
  if(!append) grid.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:20px;color:#888">Ładowanie…</p>';

  const params = {limit:PAGE_SIZE, page:currentPage};
  if(categoryId) params.category_id = categoryId;
  if(currentFilter==='popular') params.popular = true;
  else if(currentFilter==='bestseller') params.bestseller = true;
  else if(currentFilter==='sale') params.on_sale = true;
  const prods=await Api.listProducts(params).catch(()=>[]);

  if(!append && !prods.length){
    grid.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border:1px solid #ddd;color:#888">Brak produktów w tej kategorii.</p>';
    loadMoreWrap.style.display='none';
    return;
  }
  const cardsHtml = prods.map(renderProductCard).join('');

  if(append){ grid.insertAdjacentHTML('beforeend', cardsHtml); window._prods=(window._prods||[]).concat(prods); }
  else { grid.innerHTML=cardsHtml; window._prods=prods; }
  loadMoreWrap.style.display = prods.length===PAGE_SIZE ? '' : 'none';
  refreshWishlistHearts();
}
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault(); const q=document.getElementById('q').value.trim(); location.href=q?'search.html?q='+encodeURIComponent(q):'search.html'});
// Header login/logout state and the "My orders" link are handled globally
// by renderAuthHeader() in app.js (runs on DOMContentLoaded).
const urlCategoryId = new URLSearchParams(location.search).get('category_id');
loadCats().then(()=>{
  // Highlight the requested category (from a product-page breadcrumb link), else "all"
  const target = urlCategoryId ? document.getElementById('cat-'+urlCategoryId) : document.getElementById('cat-all');
  if(target){
    target.style.background='var(--accent-soft)';
    target.style.borderLeft='3px solid var(--accent)';
    target.style.color='var(--accent)';
    target.style.fontWeight='bold';
    if(urlCategoryId){ const heading=document.getElementById('catHeading'); if(heading) heading.textContent = catNamesById[urlCategoryId] || ''; }
  }
});
// Activate tab from ?filter= query param (used by top-bar "Wyprzedaż"/"Bestsellery" links)
(()=>{
  const urlFilter = new URLSearchParams(location.search).get('filter');
  if(urlFilter){
    const tabEl = document.querySelector(`.tab[data-filter="${urlFilter}"]`);
    if(tabEl){ currentFilter=urlFilter; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); tabEl.classList.add('active'); }
  }
})();
loadProducts(urlCategoryId);

async function loadRecentlyViewed(){
  const ids = RecentlyViewed.ids();
  if(!ids.length) return;
  const section = document.getElementById('recentlyViewedSection');
  const grid = document.getElementById('recentlyViewedGrid');
  const results = await Promise.all(ids.map(id => Api.getProductById(id).catch(()=>null)));
  const prods = results.filter(p => p && p.is_active);
  if(!prods.length) return;
  grid.innerHTML = prods.map(renderProductCard).join('');
  refreshWishlistHearts();
  section.style.display='';
}
loadRecentlyViewed();

</script>
</body>
</html>
