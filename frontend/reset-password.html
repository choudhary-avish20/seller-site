<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ustaw nowe hasło — WolkaGo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="topbar"><div class="container"><a href="index.html">Strona główna</a><a href="contact.html" class="topbar-contact"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg><span data-i18n="contact">Kontakt z nami</span></a></div></div>
<div class="container" style="max-width:420px;margin:40px auto">
<div style="text-align:center;margin-bottom:16px"><a href="index.html"><img src="assets/wolkago-logo.png" alt="WolkaGo" style="height:32px"></a></div>
<div style="background:#fff;border:1px solid #ddd;padding:20px">

<div id="formState" style="display:none">
  <h1 style="font-size:16px;text-align:center">Ustaw nowe hasło</h1>
  <div id="err" style="display:none;background:#fef2f2;border:1px solid #fecaca;color:#c00;padding:8px;margin:12px 0;font-size:12px"></div>
  <form id="f">
    <label style="font-size:12px;font-weight:bold">Nowe hasło</label>
    <input id="pwd" type="password" required minlength="8" style="width:100%;border:1px solid #ccc;padding:8px;margin:4px 0 8px;box-sizing:border-box">
    <label style="font-size:12px;font-weight:bold">Powtórz nowe hasło</label>
    <input id="pwd2" type="password" required minlength="8" style="width:100%;border:1px solid #ccc;padding:8px;margin:4px 0 8px;box-sizing:border-box">
    <button type="submit" style="width:100%;padding:10px;background:#333;color:#fff;border:0;font-weight:bold;cursor:pointer">Ustaw nowe hasło</button>
  </form>
</div>

<div id="successState" style="display:none;text-align:center">
  <div style="font-size:48px;margin-bottom:12px">✅</div>
  <h1 style="font-size:16px;font-weight:bold;color:#166534;margin-bottom:8px">Hasło zostało zmienione</h1>
  <p style="font-size:13px;color:#555;margin-bottom:20px">Możesz teraz zalogować się nowym hasłem.</p>
  <a href="login.html" style="display:inline-block;padding:10px 28px;background:var(--accent);color:#fff;font-weight:bold;text-decoration:none;font-size:13px">Zaloguj się</a>
</div>

<div id="invalidState" style="display:none;text-align:center">
  <div style="font-size:48px;margin-bottom:12px">❌</div>
  <h1 style="font-size:16px;font-weight:bold;color:#991b1b;margin-bottom:8px">Link nieważny lub wygasły</h1>
  <p style="font-size:13px;color:#555;margin-bottom:20px">Ten link do resetowania hasła wygasł lub został już użyty. Poproś o nowy.</p>
  <a href="forgot-password.html" style="display:inline-block;padding:10px 28px;background:var(--accent);color:#fff;font-weight:bold;text-decoration:none;font-size:13px">Wyślij nowy link</a>
</div>

</div>
</div>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');
if (!token) {
  document.getElementById('invalidState').style.display = 'block';
} else {
  document.getElementById('formState').style.display = 'block';
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.style.display = 'none';
  const pwd = document.getElementById('pwd').value;
  const pwd2 = document.getElementById('pwd2').value;
  if (pwd !== pwd2) {
    err.textContent = 'Hasła nie są identyczne.';
    err.style.display = 'block';
    return;
  }
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Zapisywanie…';
  try {
    await Api.resetPassword(token, pwd);
    document.getElementById('formState').style.display = 'none';
    document.getElementById('successState').style.display = 'block';
  } catch (ex) {
    if (ex.status === 400) {
      document.getElementById('formState').style.display = 'none';
      document.getElementById('invalidState').style.display = 'block';
    } else {
      err.textContent = ex.message || 'Błąd. Spróbuj ponownie.';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Ustaw nowe hasło';
    }
  }
});
</script>
</body></html>
