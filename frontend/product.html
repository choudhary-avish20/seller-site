<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product — WolkaGo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">
<link rel="stylesheet" href="css/style.css">
<style>
.pd-gallery{flex:1;min-width:280px}
.pd-img-box{border:1px solid #e2e2e2;background:#fff;position:relative;border-radius:6px;overflow:hidden;cursor:zoom-in;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.pd-img-box img{width:100%;display:block;transition:transform .2s}
.pd-img-box:hover img{transform:scale(1.02)}
.pd-zoom-hint{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:5px 10px;border-radius:20px;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .15s;pointer-events:none}
.pd-img-box:hover .pd-zoom-hint{opacity:1}
.pd-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pd-thumbs img{width:60px;height:60px;object-fit:cover;border-radius:4px;border:2px solid #e2e2e2;cursor:pointer;transition:border-color .15s}
.pd-thumbs img:hover{border-color:#7ec8e3}
.pd-thumbs img.active{border-color:#0099cc}

.pd-info{flex:1;min-width:300px}
.pd-title{font-size:21px;font-weight:700;margin:0 0 8px;color:#1a1a1a;line-height:1.3}
.pd-meta-row{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:#888;margin-bottom:12px}
.pd-meta-row b{color:#444}
.pd-rating-link{font-size:12px;color:#0099cc;text-decoration:none;cursor:pointer}
.pd-rating-link:hover{text-decoration:underline}

.pd-pack-bar{background:#f6f6f6;border-radius:5px;padding:8px 12px;font-size:12px;color:#555;margin-bottom:14px;display:inline-block}
.pd-pack-bar b{color:#222}

.pd-price-card{background:#fafafa;border:1px solid #eee;border-radius:8px;padding:14px 16px;margin-bottom:14px}
.pd-price-badge{display:inline-block;background:#c00;color:#fff;font-size:11px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-bottom:6px}
.pd-price-main{font-size:24px;font-weight:800;color:#1a1a1a}
.pd-price-main.on-sale{color:#c00}
.pd-price-was{color:#999;text-decoration:line-through;font-size:14px;margin-right:8px}
.pd-price-sub{font-size:12px;color:#777;margin-top:4px}
.pd-price-unit{font-size:12px;color:#666;margin-top:6px;padding-top:6px;border-top:1px dashed #e2e2e2}

.pd-tier-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.pd-tier-table th{background:#f0f0f0;padding:6px;text-align:left;font-weight:600;border:1px solid #e2e2e2}
.pd-tier-table td{padding:6px;border:1px solid #e2e2e2}

.pd-qty-label{font-size:12px;font-weight:600;color:#333;margin-bottom:6px}
.pd-qty-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.pd-qty-stepper{display:flex;align-items:center;border:1px solid #ddd;border-radius:5px;overflow:hidden}
.pd-qty-stepper button{width:34px;height:34px;border:0;background:#f7f7f7;cursor:pointer;font-size:16px;color:#333}
.pd-qty-stepper button:hover{background:#eee}
.pd-qty-stepper input{width:56px;height:34px;border:0;border-left:1px solid #ddd;border-right:1px solid #ddd;text-align:center;font-size:13px;font-weight:600}
.pd-qty-quick{padding:6px 10px;background:#fff;border:1px solid #ccc;border-radius:5px;font-size:11px;cursor:pointer;color:#444}
.pd-qty-quick:hover{background:#f5f5f5}
.pd-qty-hint{font-size:11px;color:#888;margin-bottom:14px}

.pd-cta{width:100%;background:linear-gradient(#4aa3ff,#0066cc);color:#fff;border:0;padding:13px;font-weight:bold;font-size:14px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 6px rgba(0,102,204,.3);transition:filter .15s}
.pd-cta:hover{filter:brightness(1.05)}
.pd-secondary-actions{display:flex;gap:16px;margin-top:12px;font-size:12px}
.pd-secondary-actions a{color:#666;text-decoration:none}
.pd-secondary-actions a:hover{color:#0099cc}

.pd-section{margin-top:16px;border:1px solid #e2e2e2;background:#fff;border-radius:8px;overflow:hidden}
.pd-section-head{padding:12px 16px;background:#f7f7f7;font-weight:700;font-size:13px;border-bottom:1px solid #e2e2e2;display:flex;justify-content:space-between;align-items:center}
.pd-section-body{padding:14px 16px}

.pd-zoom-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,10,.9);z-index:99;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
.pd-zoom-overlay img{max-width:90vw;max-height:88vh;background:#fff;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.pd-zoom-close{position:fixed;top:18px;right:22px;width:38px;height:38px;border-radius:50%;border:0;background:#fff;cursor:pointer;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div class="topbar"><div class="container"><div>B2B only</div><div><span class="lang"><button data-lang="pl" class="active">PL</button><button data-lang="en">EN</button></span> <a href="login.html" id="top-login" data-i18n="login">Zaloguj</a></div></div></div>
<div class="header"><div class="container"><a href="index.html" class="logo"><img src="assets/wolkago-logo.png" alt="WolkaGo"></a>
<form class="search" id="searchForm"><input id="q" placeholder="Szukaj..."><button>Szukaj</button></form>
<a href="cart.html" class="cart">Koszyk <b data-cart-count>0</b></a></div></div>

<div class="container">
<div class="breadcrumb" id="crumb"><a href="index.html">⌂</a><a href="index.html" id="crumb-cat" style="display:none"></a><span class="current" id="crumb-current"></span></div>
<div class="layout">
<aside class="sidebar"><div class="sidebar-head">HAIR BANDS</div><div class="cat-list" id="catList"></div></aside>
<main class="main">
<div class="detail">
  <div class="pd-gallery">
    <div class="pd-img-box" id="imgBox">
      <div class="ribbon" style="left:-28px" id="detailRibbon">NEW</div>
      <img id="mainImg" src="" alt="" style="min-height:260px">
      <div class="pd-zoom-hint">🔍 Kliknij, aby powiększyć</div>
    </div>
    <div class="pd-thumbs" id="thumbRow"></div>
  </div>
  <div class="pd-info" id="info"></div>
</div>
<div class="pd-section">
  <div class="pd-section-head">ℹ️ Więcej informacji</div>
  <div class="pd-section-body" id="more" style="font-size:12px;color:#555;white-space:pre-line"></div>
</div>
<div class="pd-section" id="reviewsSection">
  <div class="pd-section-head">
    <span>⭐ Opinie klientów</span>
    <span id="ratingSummary" style="font-weight:normal;font-size:12px;color:#666"></span>
  </div>
  <div id="reviewForm" class="pd-section-body" style="border-bottom:1px solid #eee;display:none">
    <div style="font-size:12px;font-weight:bold;margin-bottom:6px">Dodaj opinię</div>
    <div id="starPicker" style="font-size:22px;color:#ddd;cursor:pointer;margin-bottom:8px"></div>
    <textarea id="reviewComment" rows="2" placeholder="Twoja opinia (opcjonalnie)…" style="width:100%;border:1px solid #ccc;padding:6px 8px;font-family:inherit;font-size:12px;border-radius:4px"></textarea>
    <button onclick="submitReview()" style="margin-top:8px;padding:7px 16px;background:#333;color:#fff;border:0;font-size:12px;font-weight:bold;cursor:pointer;border-radius:4px">Wyślij opinię</button>
    <span id="reviewMsg" style="font-size:11px;color:#166534;margin-left:8px"></span>
  </div>
  <div id="reviewsList" class="pd-section-body"></div>
</div>
<div style="margin-top:14px" id="recoSection">
  <div style="font-size:14px;font-weight:bold;color:#333;margin-bottom:8px">You may also like</div>
  <div class="grid" id="recoGrid"></div>
</div>
</main>
</div>
</div>

<div id="zoom" class="pd-zoom-overlay" onclick="closeZoom()">
  <img id="zoomImg" alt="">
  <button class="pd-zoom-close" onclick="event.stopPropagation();closeZoom()">×</button>
</div>

<div id="site-footer"></div>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
async function load(){
  const slug=new URLSearchParams(location.search).get('slug') || location.hash.slice(1);
  if(!slug){ document.getElementById('info').innerHTML='No slug'; return; }
  const tree=await Api.getCategoryTree().catch(()=>[]);
  document.getElementById('catList').innerHTML = tree.slice(0,12).map(n=>`<div class="cat-item"><span>${esc(n.name)}</span><span class="plus">+</span></div>`).join('');
  try{
    const p=await Api.getProductBySlug(slug);
    document.getElementById('crumb-current').textContent=p.name;
    if(p.category_name){
      const catLink=document.getElementById('crumb-cat');
      catLink.textContent=p.category_name.toUpperCase();
      catLink.href = p.category_id ? `index.html?category_id=${encodeURIComponent(p.category_id)}` : 'index.html';
      catLink.style.display='';
    }
    const ribbon = p.is_on_sale ? 'SALE' : (p.is_bestseller ? 'BESTSELLER' : (p.is_popular ? 'POPULAR' : 'NEW'));
    document.getElementById('detailRibbon').textContent = ribbon;
    document.getElementById('mainImg').src=Api.img(p.images[0]||'');
    if(p.images && p.images.length>1){
      document.getElementById('thumbRow').innerHTML = p.images.map((u,i)=>
        `<img src="${esc(Api.img(u))}" data-i="${i}" class="${i===0?'active':''}" onclick="selectThumb(this)">`
      ).join('');
    }
    window.selectThumb=(el)=>{
      const u = p.images[Number(el.dataset.i)];
      document.getElementById('mainImg').src=Api.img(u);
      document.querySelectorAll('#thumbRow img').forEach(t=>t.classList.remove('active'));
      el.classList.add('active');
    };
    // tiered table
    let tierRows='';
    if(p.price_tiers && p.price_tiers.length){
      tierRows = p.price_tiers.map(tr=>`<tr><td>${tr.min_quantity}-${tr.max_quantity||'∞'}</td><td>${Number(tr.price_net).toFixed(2)} PLN</td><td>${(Number(tr.price_net)*1.23).toFixed(2)} PLN</td></tr>`).join('');
      tierRows = `<table class="pd-tier-table"><tr><th>Ilość (paczki)</th><th>netto</th><th>brutto</th></tr>${tierRows}</table>`;
    }
    const isGuest=!localStorage.getItem('access_token');
    // check config for hide prices
    let hide=false; try{ const cfg=await Api.getConfig(); hide=cfg.require_login_to_see_prices && isGuest; }catch{}
    const inc=p.pack_increment||1;
    document.getElementById('info').innerHTML=`
      <h1 class="pd-title">${esc(p.name)}</h1>
      <div class="pd-meta-row">
        <span>Kod: <b>${esc(p.sku||p.slug)}</b></span>
        <span>Dodano: <b>${new Date(p.created_at).toLocaleDateString('pl-PL')}</b></span>
        ${p.review_count ? `<a href="#reviewsSection" class="pd-rating-link">${renderStars(p.avg_rating, false)} ${p.avg_rating} (${p.review_count})</a>` : ''}
      </div>
      ${hide? `<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:12px;margin:10px 0;font-size:12px">Ceny widoczne po zalogowaniu — <a href="login.html" style="color:#0066cc">Zaloguj się</a> / <a href="signup.html" style="color:#0066cc">Zarejestruj się</a></div>` : `
      <div class="pd-pack-bar">w paczce: <b>${p.pack_size} ${p.pack_size===1?'para':'szt.'}</b>${p.stall_location? ` • Stoisko ${p.stall_location}${p.counter_number? ' / Lada '+p.counter_number:''}`:''}</div>
      <div class="pd-price-card">
        ${p.is_on_sale && p.sale_price_net!=null && p.discount_percent ? `<span class="pd-price-badge">-${p.discount_percent}%</span>` : ''}
        ${p.is_on_sale && p.sale_price_net!=null ? `
        <div><span class="pd-price-was">${Number(p.price_net).toFixed(2)} PLN</span><span class="pd-price-main on-sale">${Number(p.sale_price_net).toFixed(2)} PLN</span> <span style="font-size:13px;color:#888">netto</span></div>
        <div class="pd-price-sub"><s>${Number(p.price_gross).toFixed(2)} PLN</s> <b style="color:#c00">${Number(p.sale_price_gross).toFixed(2)} PLN</b> brutto</div>
        ` : `
        <div><span class="pd-price-main">${Number(p.price_net).toFixed(2)} PLN</span> <span style="font-size:13px;color:#888">netto</span></div>
        <div class="pd-price-sub">${Number(p.price_gross).toFixed(2)} PLN brutto</div>
        `}
        ${(()=>{ const effNet=(p.is_on_sale&&p.sale_price_net!=null)?p.sale_price_net:p.price_net; const effGross=(p.is_on_sale&&p.sale_price_gross!=null)?p.sale_price_gross:p.price_gross;
          return `<div class="pd-price-unit">cena za ${p.pack_size===1?'parę':'szt.'}: <b>${(Number(effNet)/p.pack_size).toFixed(2)} PLN netto</b> · ${(Number(effGross)/p.pack_size).toFixed(2)} PLN brutto</div>`; })()}
        ${tierRows}
      </div>
      ${p.variants&&p.variants.length? `<div style="margin-bottom:12px;font-size:12px"><b>Kolory / Rozmiary:</b> ${p.variants.map(v=>`${esc(v.option_name)}: ${esc(v.option_value)} (${esc(v.sku)})`).join(', ')}</div>`:''}
      <div class="pd-qty-label">Ilość</div>
      <div class="pd-qty-row">
        <div class="pd-qty-stepper">
          <button onclick="chg(-1)">−</button>
          <input id="qty" value="${inc}" data-inc="${inc}">
          <button onclick="chg(1)">+</button>
        </div>
        <button class="pd-qty-quick" onclick="chg(12)">+12</button>
        <button class="pd-qty-quick" onclick="chg(40)">+40</button>
      </div>
      <div class="pd-qty-hint">Minimalna ilość zamówienia dla tego produktu to ${inc}</div>
      <button class="pd-cta" id="addBtn"><span>🛒</span> Dodaj do koszyka</button>
      <div class="pd-secondary-actions">
        <a href="#" id="wishlistBtn">♡ Dodaj do listy życzeń</a>
        <a href="#" onclick="window.print();return false">🖨 Drukuj</a>
      </div>
      `}
    `;
    if(!hide){
      document.getElementById('addBtn').onclick=()=>{
        const inp=document.getElementById('qty');
        let q=parseInt(inp.value||inc,10);
        q=Math.ceil(q/inc)*inc;
        // No frozen price passed here — Cart.linePrice() recomputes sale/tier pricing
        // live from packQuantity every time the cart is rendered or the qty changes,
        // so it never goes stale the way a snapshot taken at add-to-cart time would.
        Cart.add(p, q);
        alert('Added '+q+' packs');
      };
      window.chg=(dir)=>{
        const inp=document.getElementById('qty');
        let v=parseInt(inp.value||inc,10);
        if(dir===1) v+=inc;
        else if(dir===-1) v-=inc;
        else v+=dir;
        if(v<inc) v=inc;
        v=Math.ceil(v/inc)*inc;
        inp.value=v;
      };
    }
    document.getElementById('more').textContent = p.description || 'No description';
    const wishlistBtn = document.getElementById('wishlistBtn');
    if(wishlistBtn){
      Wishlist.has(p.id).then(has=>{ if(has) wishlistBtn.textContent = '♥ Saved to wishlist'; });
      wishlistBtn.onclick = async (e) => {
        e.preventDefault();
        const nowSaved = await Wishlist.toggle(p.id);
        if(nowSaved === null) return; // not logged in — redirected
        wishlistBtn.textContent = nowSaved ? '♥ Saved to wishlist' : '♡ Add to wishlist';
      };
    }
    RecentlyViewed.track(p.id);
    loadReviews(p);
    loadRecommended(p);
  }catch(e){
    document.getElementById('info').innerHTML='<p style="color:red">'+e.message+'</p>';
  }
}

let currentProduct = null;
let selectedStars = 0;

function renderStars(n, interactive){
  const full = '★'.repeat(Math.round(n)), empty = '☆'.repeat(5 - Math.round(n));
  if(!interactive) return `<span style="color:#f5a623">${full}</span><span style="color:#ddd">${empty}</span>`;
  return [1,2,3,4,5].map(i => `<span data-star="${i}" onclick="pickStar(${i})" style="color:${i<=n?'#f5a623':'#ddd'}">★</span>`).join('');
}
function pickStar(n){
  selectedStars = n;
  document.getElementById('starPicker').innerHTML = renderStars(n, true);
}

async function loadReviews(p){
  currentProduct = p;
  const summary = document.getElementById('ratingSummary');
  summary.innerHTML = p.review_count
    ? `${renderStars(p.avg_rating, false)} ${p.avg_rating} (${p.review_count} opinii)`
    : 'Brak opinii — bądź pierwszy!';

  const me = await refreshUser().catch(()=>null);
  const form = document.getElementById('reviewForm');
  if(me && me.role === 'buyer'){
    form.style.display = 'block';
    document.getElementById('starPicker').innerHTML = renderStars(0, true);
  }

  let reviews = [];
  try{ reviews = await Api.getReviews(p.id); }catch{}
  const list = document.getElementById('reviewsList');
  if(!reviews.length){
    list.innerHTML = '<p style="color:#888;font-size:12px;padding:6px 0">Brak opinii dla tego produktu.</p>';
    return;
  }
  list.innerHTML = reviews.map(r => `
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>${renderStars(r.rating, false)} <b style="font-size:12px;margin-left:4px">${esc(r.reviewer_name)}</b></div>
        <div style="font-size:10px;color:#999">${new Date(r.created_at).toLocaleDateString('pl-PL')}${r.is_own ? ` · <a href="#" onclick="deleteOwnReview('${r.id}');return false" style="color:#c00">usuń</a>` : ''}</div>
      </div>
      ${r.comment ? `<div style="font-size:12px;color:#555;margin-top:4px">${esc(r.comment)}</div>` : ''}
    </div>`).join('');
}

async function submitReview(){
  if(!selectedStars){ document.getElementById('reviewMsg').textContent = 'Wybierz liczbę gwiazdek.'; document.getElementById('reviewMsg').style.color = '#c00'; return; }
  try{
    await Api.submitReview(currentProduct.id, { rating: selectedStars, comment: document.getElementById('reviewComment').value.trim() || null });
    document.getElementById('reviewMsg').textContent = 'Dziękujemy za opinię!';
    document.getElementById('reviewMsg').style.color = '#166534';
    document.getElementById('reviewComment').value = '';
    const p = await Api.getProductById(currentProduct.id);
    loadReviews(p);
  }catch(e){
    document.getElementById('reviewMsg').textContent = e.message || 'Błąd wysyłki opinii.';
    document.getElementById('reviewMsg').style.color = '#c00';
  }
}

async function deleteOwnReview(id){
  if(!confirm('Usunąć swoją opinię?')) return;
  try{
    await Api.deleteReview(id);
    const p = await Api.getProductById(currentProduct.id);
    loadReviews(p);
  }catch(e){ alert('Błąd: '+e.message); }
}

async function loadRecommended(p){
  const wrap=document.getElementById('recoSection');
  const grid=document.getElementById('recoGrid');
  try{
    const params={limit:9};
    if(p.category_id) params.category_id=p.category_id;
    let items=await Api.listProducts(params).catch(()=>[]);
    items=items.filter(x=>x.id!==p.id).slice(0,4);
    if(!items.length){ wrap.style.display='none'; return; }
    grid.innerHTML=items.map(rp=>{
      const img = rp.images && rp.images[0] ? Api.img(rp.images[0]) : 'https://via.placeholder.com/300x220?text=No+image';
      const slugUrl = encodeURIComponent(rp.slug);
      return `<div class="card">
        <div style="position:relative"><a href="product.html?slug=${slugUrl}"><img src="${esc(img)}" alt="${esc(rp.name)}"></a></div>
        <h3><a href="product.html?slug=${slugUrl}">${esc(rp.name)}</a></h3>
        <div class="price">
          <div>net price: <b>${Number(rp.price_net).toFixed(2)} PLN</b></div>
        </div>
      </div>`;
    }).join('');
  }catch{ wrap.style.display='none'; }
}
function openZoom(){
  const s = document.getElementById('mainImg').src;
  if(!s) return;
  document.getElementById('zoomImg').src = s;
  document.getElementById('zoom').style.display = 'flex';
}
function closeZoom(){
  document.getElementById('zoom').style.display = 'none';
}
document.getElementById('imgBox')?.addEventListener('click', openZoom);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeZoom(); });

load();

</script>
</body>
</html>
