<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product — WolkaGo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.pd-gallery{flex:1;min-width:280px}
.pd-img-box{border:1px solid var(--border);background:var(--surface);position:relative;border-radius:var(--radius-md);overflow:hidden;cursor:zoom-in;box-shadow:var(--shadow-sm)}
.pd-img-box img{width:100%;display:block;transition:transform var(--t-base)}
.pd-img-box:hover img{transform:scale(1.035)}
.pd-zoom-hint{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:5px 10px;border-radius:20px;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity var(--t-fast);pointer-events:none}
.pd-img-box:hover .pd-zoom-hint{opacity:1}
.pd-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pd-thumbs img{width:60px;height:60px;object-fit:cover;border-radius:var(--radius-sm);border:2px solid var(--border);cursor:pointer;transition:border-color var(--t-fast)}
.pd-thumbs img:hover{border-color:var(--border-strong)}
.pd-thumbs img.active{border-color:var(--accent)}

.pd-info{flex:1;min-width:300px}
.pd-title{font-size:22px;font-weight:700;margin:0 0 8px;color:var(--text-primary);line-height:1.3}
.pd-meta-row{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-bottom:16px}
.pd-meta-row b{color:var(--text-secondary);font-weight:600}
.pd-rating-link{font-size:12px;color:var(--accent);text-decoration:none;cursor:pointer}
.pd-rating-link:hover{text-decoration:underline}

.pd-pack-bar{font-size:13px;color:var(--text-secondary);margin-bottom:16px}
.pd-pack-bar b{color:var(--text-primary);font-weight:600}

.pd-price-card{padding:0;margin-bottom:18px}
.pd-price-badge{display:inline-block;background:var(--sale);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:8px}
.pd-price-main{font-size:26px;font-weight:800;color:var(--text-primary)}
.pd-price-main.on-sale{color:var(--sale)}
.pd-price-was{color:var(--muted);text-decoration:line-through;font-size:14px;margin-right:8px}
.pd-price-sub{font-size:13px;color:var(--text-secondary);margin-top:4px}
.pd-price-unit{font-size:12.5px;color:var(--text-secondary);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}

.pd-tier-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.pd-tier-table th{background:var(--surface-muted);padding:7px;text-align:left;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border)}
.pd-tier-table td{padding:7px;border-bottom:1px solid var(--border)}

.pd-qty-label{font-size:12.5px;font-weight:600;color:var(--text-primary);margin-bottom:8px}
.pd-qty-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.pd-qty-stepper{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.pd-qty-stepper button{width:36px;height:36px;border:0;background:var(--surface-muted);cursor:pointer;font-size:16px;color:var(--text-primary);transition:background var(--t-fast)}
.pd-qty-stepper button:hover{background:var(--border)}
.pd-qty-stepper input{width:56px;height:36px;border:0;border-left:1px solid var(--border);border-right:1px solid var(--border);text-align:center;font-size:13px;font-weight:600;color:var(--text-primary)}
.pd-qty-quick{padding:7px 11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11.5px;cursor:pointer;color:var(--text-secondary);transition:border-color var(--t-fast)}
.pd-qty-quick:hover{border-color:var(--border-strong);color:var(--text-primary)}
.pd-qty-hint{font-size:11.5px;color:var(--muted);margin-bottom:16px}

.pd-cta{width:100%;background:var(--text-primary);color:#fff;border:0;padding:14px;font-weight:600;font-size:14px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background var(--t-fast)}
.pd-cta:hover{background:#000}
.pd-secondary-actions{display:flex;align-items:center;gap:24px;margin-top:16px}
.pd-wish-btn{display:flex;align-items:center;gap:7px;background:none;border:0;padding:0;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:color var(--t-fast)}
.pd-wish-btn:hover{color:var(--accent)}
.pd-wish-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:fill var(--t-fast),stroke var(--t-fast)}
.pd-wish-btn.active{color:var(--sale)}
.pd-wish-btn.active svg{fill:var(--sale);stroke:var(--sale)}
.pd-print-btn{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;text-decoration:none;transition:color var(--t-fast)}
.pd-print-btn:hover{color:var(--text-secondary)}
.pd-print-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.pd-section{margin-top:40px}
.pd-section-head{padding:0 0 12px;font-weight:700;font-size:15px;color:var(--text-primary);border-bottom:1px solid var(--border);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.pd-section-body{padding:0}
.pd-empty-state{color:var(--text-secondary);font-size:13px;padding:8px 0 4px;line-height:1.6}

.reco-row{display:flex;gap:20px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.reco-row .card{flex:0 0 235px;scroll-snap-align:start}
@media(max-width:600px){.reco-row .card{flex:0 0 195px}}

.pd-sticky-bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -6px 20px rgba(0,0,0,.08);z-index:45;transform:translateY(100%);transition:transform var(--t-base) ease;padding:12px 0}
.pd-sticky-bar.visible{transform:translateY(0)}
.pd-sticky-inner{display:flex;align-items:center;justify-content:space-between;gap:16px}
.pd-sticky-info{display:flex;flex-direction:column;min-width:0}
.pd-sticky-name{font-size:12.5px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.pd-sticky-price{font-size:13.5px;font-weight:700;color:var(--text-primary)}
.pd-sticky-cta{width:auto;padding:11px 28px;flex-shrink:0}
@media(max-width:600px){.pd-sticky-name{max-width:150px}.pd-sticky-cta{padding:11px 16px;font-size:13px}}

.pd-zoom-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,10,.9);z-index:99;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
.pd-zoom-overlay img{max-width:90vw;max-height:88vh;background:#fff;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.pd-zoom-close{position:fixed;top:18px;right:22px;width:38px;height:38px;border-radius:50%;border:0;background:#fff;cursor:pointer;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div class="topbar"><div class="container"><div data-i18n="b2b">B2B only — zamówienia dla podmiotów gospodarczych</div><div><span class="lang"><button data-lang="pl" class="active">PL</button><button data-lang="en">EN</button></span> <a href="login.html" id="top-login" data-i18n="login">Zaloguj</a></div></div></div>
<div class="header"><div class="container"><a href="index.html" class="logo"><img src="assets/wolkago-logo.png" alt="WolkaGo"></a>
<form class="search" id="searchForm"><input id="q" placeholder="Szukaj..."><button>Szukaj</button></form>
<div class="header-actions">
    <a href="wishlist.html" class="cart" id="wishlistNavLink" style="display:none" aria-label="Lista życzeń">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.35-9.5-8.5C1.2 9.5 2.5 6 6 6c2 0 3.4 1.3 4.5 2.8C11.6 7.3 13 6 15 6c3.5 0 4.8 3.5 3.5 6.5C16.5 16.65 12 21 12 21z"/></svg>
      <span class="cart-copy">
        <span class="cart-label">Ulubione</span>
        <span class="cart-total" id="wishlistCountText">0 produktów</span>
      </span>
    </a>
    <a href="cart.html" class="cart" aria-label="Koszyk">
      <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <span class="cart-copy">
        <span class="cart-label">Koszyk (<b data-cart-count>0</b>)</span>
        <span class="cart-total" data-cart-net>0.00 zł</span>
      </span>
    </a>
    <div id="accountMenuSlot"></div>
  </div></div></div>

<div class="container">
<div class="breadcrumb" id="crumb"><a href="index.html">⌂</a><a href="index.html" id="crumb-cat" style="display:none"></a><span class="current" id="crumb-current"></span></div>
<div class="layout">
<aside class="sidebar"><div class="sidebar-head">Kategorie</div><div class="cat-list" id="catList"></div></aside>
<main class="main">
<div class="detail">
  <div class="pd-gallery">
    <div class="pd-img-box" id="imgBox">
      <div class="badge-row" style="position:absolute;top:10px;left:10px"><span class="pill" id="detailRibbon">New</span></div>
      <img id="mainImg" src="" alt="" style="min-height:260px">
      <div class="pd-zoom-hint">🔍 Kliknij, aby powiększyć</div>
    </div>
    <div class="pd-thumbs" id="thumbRow"></div>
  </div>
  <div class="pd-info" id="info"></div>
</div>
<div class="pd-section">
  <div class="pd-section-head">Opis produktu</div>
  <div class="pd-section-body" id="more" style="font-size:13.5px;color:var(--text-secondary);white-space:pre-line;line-height:1.7"></div>
</div>
<div class="pd-section" id="reviewsSection">
  <div class="pd-section-head">
    <span>Opinie klientów</span>
    <span id="ratingSummary" style="font-weight:normal;font-size:12.5px;color:var(--text-secondary)"></span>
  </div>
  <div id="reviewForm" class="pd-section-body" style="padding-bottom:20px;margin-bottom:6px;border-bottom:1px solid var(--border);display:none">
    <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text-primary)">Dodaj opinię</div>
    <div id="starPicker" style="font-size:22px;color:var(--border-strong);cursor:pointer;margin-bottom:10px"></div>
    <textarea id="reviewComment" rows="2" placeholder="Twoja opinia (opcjonalnie)…" style="width:100%;border:1px solid var(--border);padding:9px 11px;font-family:inherit;font-size:13px;border-radius:var(--radius-sm)"></textarea>
    <button onclick="submitReview()" style="margin-top:10px;padding:9px 18px;background:var(--text-primary);color:#fff;border:0;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:var(--radius-sm)">Wyślij opinię</button>
    <span id="reviewMsg" style="font-size:11.5px;color:var(--success);margin-left:10px"></span>
  </div>
  <div id="reviewsList" class="pd-section-body"></div>
</div>
<div class="pd-section" id="recoSection">
  <div class="pd-section-head">Może Ci się spodobać</div>
  <div class="reco-row" id="recoGrid"></div>
</div>
</main>
</div>
</div>

<div class="pd-sticky-bar" id="pdStickyBar">
  <div class="container pd-sticky-inner">
    <div class="pd-sticky-info">
      <span class="pd-sticky-name" id="pdStickyName"></span>
      <span class="pd-sticky-price" id="pdStickyPrice"></span>
    </div>
    <button class="pd-cta pd-sticky-cta" onclick="document.getElementById('addBtn').click()">Dodaj do koszyka</button>
  </div>
</div>

<div id="zoom" class="pd-zoom-overlay" onclick="closeZoom()">
  <img id="zoomImg" alt="">
  <button class="pd-zoom-close" onclick="event.stopPropagation();closeZoom()">×</button>
</div>

<div id="site-footer"></div>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
async function load(){
  const slug=new URLSearchParams(location.search).get('slug') || location.hash.slice(1);
  if(!slug){ document.getElementById('info').innerHTML='No slug'; return; }
  const tree=await Api.getCategoryTree().catch(()=>[]);
  document.getElementById('catList').innerHTML = tree.slice(0,12).map(n=>`<div class="cat-item"><span>${esc(n.name)}</span><span class="plus">+</span></div>`).join('');
  try{
    const p=await Api.getProductBySlug(slug);
    document.getElementById('crumb-current').textContent=p.name;
    if(p.category_name){
      const catLink=document.getElementById('crumb-cat');
      catLink.textContent=p.category_name.toUpperCase();
      catLink.href = p.category_id ? `index.html?category_id=${encodeURIComponent(p.category_id)}` : 'index.html';
      catLink.style.display='';
    }
    const ribbonEl = document.getElementById('detailRibbon');
    if(p.is_on_sale && p.discount_percent){ ribbonEl.textContent = `-${p.discount_percent}%`; ribbonEl.classList.add('pill-sale'); }
    else { ribbonEl.textContent = p.is_bestseller ? 'Bestseller' : (p.is_popular ? 'Popularne' : 'Nowość'); ribbonEl.classList.remove('pill-sale'); }
    document.getElementById('mainImg').src=Api.img(p.images[0]||'');
    if(p.images && p.images.length>1){
      document.getElementById('thumbRow').innerHTML = p.images.map((u,i)=>
        `<img src="${esc(Api.img(u))}" data-i="${i}" class="${i===0?'active':''}" onclick="selectThumb(this)">`
      ).join('');
    }
    window.selectThumb=(el)=>{
      const u = p.images[Number(el.dataset.i)];
      document.getElementById('mainImg').src=Api.img(u);
      document.querySelectorAll('#thumbRow img').forEach(t=>t.classList.remove('active'));
      el.classList.add('active');
    };
    // tiered table
    let tierRows='';
    if(p.price_tiers && p.price_tiers.length){
      tierRows = p.price_tiers.map(tr=>`<tr><td>${tr.min_quantity}-${tr.max_quantity||'∞'}</td><td>${Number(tr.price_net).toFixed(2)} PLN</td><td>${(Number(tr.price_net)*1.23).toFixed(2)} PLN</td></tr>`).join('');
      tierRows = `<table class="pd-tier-table"><tr><th>Ilość (paczki)</th><th>netto</th><th>brutto</th></tr>${tierRows}</table>`;
    }
    const isGuest=!localStorage.getItem('access_token');
    // check config for hide prices
    let hide=false; try{ const cfg=await Api.getConfig(); hide=cfg.require_login_to_see_prices && isGuest; }catch{}
    const inc=p.pack_increment||1;
    document.getElementById('info').innerHTML=`
      <h1 class="pd-title">${esc(p.name)}</h1>
      <div class="pd-meta-row">
        <span>Kod: <b>${esc(p.sku||p.slug)}</b></span>
        <span>Dodano: <b>${new Date(p.created_at).toLocaleDateString('pl-PL')}</b></span>
        ${p.review_count ? `<a href="#reviewsSection" class="pd-rating-link">${renderStars(p.avg_rating, false)} ${p.avg_rating} (${p.review_count})</a>` : ''}
      </div>
      ${hide? `<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:12px;margin:10px 0;font-size:12px">Ceny widoczne po zalogowaniu — <a href="login.html" style="color:#0066cc">Zaloguj się</a> / <a href="signup.html" style="color:#0066cc">Zarejestruj się</a></div>` : `
      <div class="pd-pack-bar">w paczce: <b>${p.pack_size} ${p.pack_size===1?'para':'szt.'}</b>${p.stall_location? ` • Stoisko ${p.stall_location}${p.counter_number? ' / Lada '+p.counter_number:''}`:''}</div>
      <div class="pd-price-card">
        ${p.is_on_sale && p.sale_price_net!=null && p.discount_percent ? `<span class="pd-price-badge">-${p.discount_percent}%</span>` : ''}
        ${p.is_on_sale && p.sale_price_net!=null ? `
        <div><span class="pd-price-was">${Number(p.price_net).toFixed(2)} PLN</span><span class="pd-price-main on-sale">${Number(p.sale_price_net).toFixed(2)} PLN</span> <span style="font-size:13px;color:var(--muted)">netto</span></div>
        <div class="pd-price-sub"><s>${Number(p.price_gross).toFixed(2)} PLN</s> <b style="color:#c00">${Number(p.sale_price_gross).toFixed(2)} PLN</b> brutto</div>
        ` : `
        <div><span class="pd-price-main">${Number(p.price_net).toFixed(2)} PLN</span> <span style="font-size:13px;color:var(--muted)">netto</span></div>
        <div class="pd-price-sub">${Number(p.price_gross).toFixed(2)} PLN brutto</div>
        `}
        ${(()=>{ const effNet=(p.is_on_sale&&p.sale_price_net!=null)?p.sale_price_net:p.price_net; const effGross=(p.is_on_sale&&p.sale_price_gross!=null)?p.sale_price_gross:p.price_gross;
          return `<div class="pd-price-unit">cena za ${p.pack_size===1?'parę':'szt.'}: <b>${(Number(effNet)/p.pack_size).toFixed(2)} PLN netto</b> · ${(Number(effGross)/p.pack_size).toFixed(2)} PLN brutto</div>`; })()}
        ${tierRows}
      </div>
      ${p.variants&&p.variants.length? `<div style="margin-bottom:12px;font-size:12px"><b>Kolory / Rozmiary:</b> ${p.variants.map(v=>`${esc(v.option_name)}: ${esc(v.option_value)} (${esc(v.sku)})`).join(', ')}</div>`:''}
      <div class="pd-qty-label">Ilość</div>
      <div class="pd-qty-row">
        <div class="pd-qty-stepper">
          <button onclick="chg(-1)">−</button>
          <input id="qty" value="${inc}" data-inc="${inc}">
          <button onclick="chg(1)">+</button>
        </div>
        <button class="pd-qty-quick" onclick="chg(12)">+12</button>
        <button class="pd-qty-quick" onclick="chg(40)">+40</button>
      </div>
      <div class="pd-qty-hint">Minimalna ilość zamówienia dla tego produktu to ${inc}</div>
      <button class="pd-cta" id="addBtn"><span>🛒</span> Dodaj do koszyka</button>
      <div class="pd-secondary-actions">
        <button class="pd-wish-btn" id="wishlistBtn" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.35-9.5-8.5C1.2 9.5 2.5 6 6 6c2 0 3.4 1.3 4.5 2.8C11.6 7.3 13 6 15 6c3.5 0 4.8 3.5 3.5 6.5C16.5 16.65 12 21 12 21z"/></svg>
          <span>Dodaj do listy życzeń</span>
        </button>
        <a href="#" class="pd-print-btn" onclick="window.print();return false">
          <svg viewBox="0 0 24 24"><path d="M6 9V4h12v5"/><rect x="6" y="13" width="12" height="8"/><rect x="4" y="9" width="16" height="6" rx="1"/></svg>
          <span>Drukuj</span>
        </a>
      </div>
      `}
    `;
    if(!hide){
      document.getElementById('addBtn').onclick=()=>{
        const inp=document.getElementById('qty');
        let q=parseInt(inp.value||inc,10);
        q=Math.ceil(q/inc)*inc;
        // No frozen price passed here — Cart.linePrice() recomputes sale/tier pricing
        // live from packQuantity every time the cart is rendered or the qty changes,
        // so it never goes stale the way a snapshot taken at add-to-cart time would.
        Cart.add(p, q);
        showToast(`Dodano do koszyka: ${q} szt. — ${esc(p.name)}`);
      };
      window.chg=(dir)=>{
        const inp=document.getElementById('qty');
        let v=parseInt(inp.value||inc,10);
        if(dir===1) v+=inc;
        else if(dir===-1) v-=inc;
        else v+=dir;
        if(v<inc) v=inc;
        v=Math.ceil(v/inc)*inc;
        inp.value=v;
      };
      // Sticky buy bar: reuses the real #addBtn click handler and #qty value
      // directly (no separate cart/quantity state), just proxies the click —
      // appears once the main purchase area scrolls out of view.
      const effNet=(p.is_on_sale&&p.sale_price_net!=null)?p.sale_price_net:p.price_net;
      document.getElementById('pdStickyName').textContent = p.name;
      document.getElementById('pdStickyPrice').textContent = `${Number(effNet).toFixed(2)} PLN netto`;
      const stickyBar = document.getElementById('pdStickyBar');
      new IntersectionObserver((entries)=>{
        const entry = entries[0];
        stickyBar.classList.toggle('visible', !entry.isIntersecting && entry.boundingClientRect.top < 0);
      }, { threshold: 0 }).observe(document.getElementById('addBtn'));
    }
    document.getElementById('more').textContent = p.description || 'Brak opisu produktu.';
    const wishlistBtn = document.getElementById('wishlistBtn');
    if(wishlistBtn){
      const wishLabel = wishlistBtn.querySelector('span');
      const setWishState = (saved) => {
        wishlistBtn.classList.toggle('active', saved);
        wishLabel.textContent = saved ? 'Zapisano w liście życzeń' : 'Dodaj do listy życzeń';
      };
      Wishlist.has(p.id).then(setWishState);
      wishlistBtn.onclick = async () => {
        const nowSaved = await Wishlist.toggle(p.id);
        if(nowSaved === null) return; // not logged in — redirected
        setWishState(nowSaved);
        if(typeof updateWishlistBadge === 'function') updateWishlistBadge();
      };
    }
    RecentlyViewed.track(p.id);
    loadReviews(p);
    loadRecommended(p);
  }catch(e){
    document.getElementById('info').innerHTML='<p style="color:red">'+e.message+'</p>';
  }
}

let currentProduct = null;
let selectedStars = 0;

function renderStars(n, interactive){
  const full = '★'.repeat(Math.round(n)), empty = '☆'.repeat(5 - Math.round(n));
  if(!interactive) return `<span style="color:#f5a623">${full}</span><span style="color:#ddd">${empty}</span>`;
  return [1,2,3,4,5].map(i => `<span data-star="${i}" onclick="pickStar(${i})" onmouseover="previewStar(${i})" onmouseout="previewStar(selectedStars)" style="color:${i<=n?'#f5a623':'#ddd'};transition:color 120ms ease">★</span>`).join('');
}
function pickStar(n){
  selectedStars = n;
  document.getElementById('starPicker').innerHTML = renderStars(n, true);
}
function previewStar(n){
  document.querySelectorAll('#starPicker [data-star]').forEach(el=>{
    el.style.color = Number(el.dataset.star) <= n ? '#f5a623' : '#ddd';
  });
}

async function loadReviews(p){
  currentProduct = p;
  const summary = document.getElementById('ratingSummary');
  summary.innerHTML = p.review_count
    ? `${renderStars(p.avg_rating, false)} ${p.avg_rating} (${p.review_count} opinii)`
    : '';

  const me = await refreshUser().catch(()=>null);
  const form = document.getElementById('reviewForm');
  if(me && me.role === 'buyer'){
    form.style.display = 'block';
    document.getElementById('starPicker').innerHTML = renderStars(0, true);
  }

  let reviews = [];
  try{ reviews = await Api.getReviews(p.id); }catch{}
  const list = document.getElementById('reviewsList');
  if(!reviews.length){
    list.innerHTML = `<div class="pd-empty-state">
      <p style="font-weight:600;color:var(--text-primary);margin-bottom:4px">Brak opinii.</p>
      <p>Bądź pierwszą osobą, która oceni ten produkt.</p>
    </div>`;
    return;
  }
  list.innerHTML = reviews.map(r => `
    <div style="padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>${renderStars(r.rating, false)} <b style="font-size:12px;margin-left:4px">${esc(r.reviewer_name)}</b></div>
        <div style="font-size:10px;color:var(--muted)">${new Date(r.created_at).toLocaleDateString('pl-PL')}${r.is_own ? ` · <a href="#" onclick="deleteOwnReview('${r.id}');return false" style="color:#c00">usuń</a>` : ''}</div>
      </div>
      ${r.comment ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:4px">${esc(r.comment)}</div>` : ''}
    </div>`).join('');
}

async function submitReview(){
  if(!selectedStars){ document.getElementById('reviewMsg').textContent = 'Wybierz liczbę gwiazdek.'; document.getElementById('reviewMsg').style.color = '#c00'; return; }
  try{
    await Api.submitReview(currentProduct.id, { rating: selectedStars, comment: document.getElementById('reviewComment').value.trim() || null });
    document.getElementById('reviewMsg').textContent = 'Dziękujemy za opinię!';
    document.getElementById('reviewMsg').style.color = '#166534';
    document.getElementById('reviewComment').value = '';
    const p = await Api.getProductById(currentProduct.id);
    loadReviews(p);
  }catch(e){
    document.getElementById('reviewMsg').textContent = e.message || 'Błąd wysyłki opinii.';
    document.getElementById('reviewMsg').style.color = '#c00';
  }
}

async function deleteOwnReview(id){
  if(!confirm('Usunąć swoją opinię?')) return;
  try{
    await Api.deleteReview(id);
    const p = await Api.getProductById(currentProduct.id);
    loadReviews(p);
  }catch(e){ alert('Błąd: '+e.message); }
}

async function loadRecommended(p){
  const wrap=document.getElementById('recoSection');
  const grid=document.getElementById('recoGrid');
  try{
    const params={limit:12};
    if(p.category_id) params.category_id=p.category_id;
    let items=await Api.listProducts(params).catch(()=>[]);
    // Real recommendations only — a couple of matches renders as a compact,
    // intentional row rather than faking products to fill a fixed grid.
    items=items.filter(x=>x.id!==p.id).slice(0,8);
    if(!items.length){ wrap.style.display='none'; return; }
    grid.innerHTML = items.map(renderProductCard).join('');
    refreshWishlistHearts();
  }catch{ wrap.style.display='none'; }
}
function openZoom(){
  const s = document.getElementById('mainImg').src;
  if(!s) return;
  document.getElementById('zoomImg').src = s;
  document.getElementById('zoom').style.display = 'flex';
}
function closeZoom(){
  document.getElementById('zoom').style.display = 'none';
}
document.getElementById('imgBox')?.addEventListener('click', openZoom);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeZoom(); });

load();

</script>
