<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product — Wholesale</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar"><div class="container"><div>B2B only</div><div><a href="login.html">Zaloguj</a></div></div></div>
<div class="header"><div class="container"><a href="index.html" class="logo">Centrum<span>Hurt</span>.pl</a>
<form class="search" id="searchForm"><input id="q" placeholder="Szukaj..."><button>Szukaj</button></form>
<a href="cart.html" class="cart">Koszyk <b data-cart-count>0</b></a></div></div>

<div class="container">
<div class="breadcrumb" id="crumb"><a href="index.html">⌂</a><a href="categories.html">HAIR ACCESSORIES</a><a href="categories.html">HAIR BANDS</a><span class="current" id="crumb-current">Hairbands 8752</span></div>
<div class="layout">
<aside class="sidebar"><div class="sidebar-head">HAIR BANDS</div><div class="cat-list" id="catList"></div></aside>
<main class="main">
<div class="detail">
  <div class="detail-img" id="imgBox" style="cursor:zoom-in">
    <div class="ribbon" style="left:-28px">NEW</div>
    <img id="mainImg" src="" alt="" style="min-height:260px">
  </div>
  <div class="detail-info" id="info"></div>
</div>
<div style="margin-top:14px;border:1px solid #ddd;background:#fff">
  <div style="padding:8px 10px;background:#f5f5f5;font-weight:bold;border-bottom:1px solid #ddd">MORE INFORMATION</div>
  <div id="more" style="padding:10px;font-size:12px;color:#555"></div>
</div>
</main>
</div>
</div>

<div id="zoom" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:99;align-items:center;justify-content:center;padding:20px"><img id="zoomImg" style="max-width:90vw;max-height:90vh;background:#fff"><button onclick="document.getElementById('zoom').style.display='none'" style="position:fixed;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:0;background:#fff;cursor:pointer">×</button></div>

<script src="js/app.js"></script>
<script>
async function load(){
  const slug=new URLSearchParams(location.search).get('slug') || location.hash.slice(1);
  if(!slug){ document.getElementById('info').innerHTML='No slug'; return; }
  const tree=await Api.getCategoryTree().catch(()=>[]);
  document.getElementById('catList').innerHTML = tree.slice(0,12).map(n=>`<div class="cat-item"><span>${n.name}</span><span class="plus">+</span></div>`).join('');
  try{
    const p=await Api.getProductBySlug(slug);
    document.getElementById('crumb-current').textContent=p.name;
    document.getElementById('mainImg').src=Api.img(p.images[0]||'');
    document.getElementById('mainImg').onclick=()=>{ document.getElementById('zoomImg').src=Api.img(p.images[0]||''); document.getElementById('zoom').style.display='flex'; };
    // tiered table
    let tierRows='';
    if(p.price_tiers && p.price_tiers.length){
      tierRows = p.price_tiers.map(tr=>`<tr><td>${tr.min_quantity}-${tr.max_quantity||'∞'}</td><td>${Number(tr.price_net).toFixed(2)} PLN</td><td>${(Number(tr.price_net)*1.23).toFixed(2)} PLN</td></tr>`).join('');
      tierRows = `<table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:11px"><tr style="background:#f5f5f5"><th style="border:1px solid #ddd;padding:4px">Qty packs</th><th style="border:1px solid #ddd;padding:4px">net</th><th style="border:1px solid #ddd;padding:4px">gross</th></tr>${tierRows}</table><div style="font-size:10px;color:#666;margin-top:2px">Example: 1–10: 10.00 | 11–50: 9.50 | 50+: 9.00</div>`;
    }
    const isGuest=!localStorage.getItem('access_token');
    // check config for hide prices
    let hide=false; try{ const cfg=await Api.getConfig(); hide=cfg.require_login_to_see_prices && isGuest; }catch{}
    const inc=p.pack_increment||1;
    document.getElementById('info').innerHTML=`
      <h1 style="font-size:16px">${p.name}</h1>
      <div class="meta">Code: <b>${p.sku||p.slug}</b></div>
      <div class="meta">Condition: New product</div>
      <div class="meta">Date posted: ${new Date(p.created_at).toLocaleDateString()} ${new Date(p.created_at).toLocaleTimeString()}</div>
      ${hide? `<div style="background:#fffbeb;border:1px solid #fde68a;padding:12px;margin:10px 0;font-size:12px">Prices visible after login — <a href="login.html" style="color:#0066cc">Zaloguj się</a> / <a href="signup.html" style="color:#0066cc">Register</a></div>` : `
      <div class="grey-bar">in a package: <b>${p.pack_size} ${p.pack_size===1?'pair':'pairs'}</b> ${p.stall_location? `• Stall ${p.stall_location}${p.counter_number? ' / Counter '+p.counter_number:''}`:''}</div>
      <div class="price-block">
        <div>package price:</div>
        <div><b>PLN ${Number(p.price_net).toFixed(2)} net</b> &nbsp; <b>PLN ${Number(p.price_gross).toFixed(2)} gross</b></div>
        <div>price per ${p.pack_size===1?'pair':'pcs'}: <b>PLN ${(Number(p.price_net)/p.pack_size).toFixed(2)} net</b> PLN ${(Number(p.price_gross)/p.pack_size).toFixed(2)} gross</div>
      </div>
      ${tierRows}
      ${p.variants&&p.variants.length? `<div style="margin-top:8px;font-size:12px"><b>Colours / Sizes:</b> ${p.variants.map(v=>`${v.option_name}:${v.option_value} (${v.sku})`).join(', ')}</div>`:''}
      <div style="margin-top:8px;font-size:12px">Quantity</div>
      <div class="qty-block">
        <button onclick="chg(-1)">−</button>
        <input id="qty" value="${inc}" data-inc="${inc}" style="width:60px">
        <button onclick="chg(1)">+</button>
        <button onclick="chg(12)" style="margin-left:6px;padding:4px 6px;background:#fff;border:1px solid #ccc;font-size:11px">+12</button>
        <button onclick="chg(40)" style="padding:4px 6px;background:#fff;border:1px solid #ccc;font-size:11px">+40</button>
      </div>
      <div style="font-size:11px;color:#666">The minimum order quantity for this product is ${inc}</div>
      <button class="btn-cart" id="addBtn"><span>🛒</span> Add to cart</button>
      <div style="margin-top:8px"><a href="#" style="font-size:11px;color:#666">♡ Add to wishlist</a></div>
      <div class="social"><a href="#">Tweet</a><a href="#">Share</a><a href="#">Google+</a><a href="#">Pinterest</a></div>
      <div style="margin-top:6px"><a href="#" onclick="window.print();return false" style="font-size:11px">🖨 Print</a></div>
      `}
      <div id="more" style="display:none"></div>
    `;
    if(!hide){
      document.getElementById('addBtn').onclick=()=>{
        const inp=document.getElementById('qty');
        let q=parseInt(inp.value||inc,10);
        q=Math.ceil(q/inc)*inc;
        // tiered price recalc
        let net=p.price_net;
        if(p.price_tiers && p.price_tiers.length){
          const s=[...p.price_tiers].sort((a,b)=>a.min_quantity-b.min_quantity);
          for(const tr of s){ const mx=tr.max_quantity??Infinity; if(q>=tr.min_quantity && q<=mx){ net=tr.price_net; break; } }
          if(q> s[s.length-1].min_quantity) net=s[s.length-1].price_net;
        }
        Cart.add(p, q, null, null, net);
        alert('Added '+q+' packs');
      };
      window.chg=(dir)=>{
        const inp=document.getElementById('qty');
        let v=parseInt(inp.value||inc,10);
        if(dir===1) v+=inc;
        else if(dir===-1) v-=inc;
        else v+=dir;
        if(v<inc) v=inc;
        v=Math.ceil(v/inc)*inc;
        inp.value=v;
      };
    }
    document.getElementById('more').textContent = p.description || 'No description';
    document.querySelector('#more').parentElement.querySelector('div').textContent = p.description || '';
  }catch(e){
    document.getElementById('info').innerHTML='<p style="color:red">'+e.message+'</p>';
  }
}
document.getElementById('imgBox')?.addEventListener('click',()=>{ const s=document.getElementById('mainImg').src; if(s){ document.getElementById('zoomImg').src=s; document.getElementById('zoom').style.display='flex'; }});
load();

</script>
</body>
</html>
