<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nie pamiętasz hasła? — WolkaGo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="topbar"><div class="container"><a href="index.html">Strona główna</a><a href="contact.html" class="topbar-contact"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg><span data-i18n="contact">Kontakt z nami</span></a></div></div>
<div class="container" style="max-width:420px;margin:40px auto">
<div style="text-align:center;margin-bottom:16px"><a href="index.html"><img src="assets/wolkago-logo.png" alt="WolkaGo" style="height:32px"></a></div>
<div style="background:#fff;border:1px solid #ddd;padding:20px">

<div id="formState">
  <h1 style="font-size:16px;text-align:center">Nie pamiętasz hasła?</h1>
  <p style="font-size:12px;color:#666;text-align:center;margin:8px 0 16px">Podaj adres e-mail powiązany z kontem — wyślemy link do zresetowania hasła.</p>
  <div id="err" style="display:none;background:#fef2f2;border:1px solid #fecaca;color:#c00;padding:8px;margin:12px 0;font-size:12px"></div>
  <form id="f">
    <label style="font-size:12px;font-weight:bold">Email</label>
    <input id="email" type="email" required style="width:100%;border:1px solid #ccc;padding:8px;margin:4px 0 8px;box-sizing:border-box">
    <button type="submit" style="width:100%;padding:10px;background:#333;color:#fff;border:0;font-weight:bold;cursor:pointer">Wyślij link resetujący</button>
  </form>
</div>

<div id="sentState" style="display:none;text-align:center">
  <div style="font-size:48px;margin-bottom:12px">📧</div>
  <h1 style="font-size:16px;font-weight:bold;color:#1e40af;margin-bottom:8px">Sprawdź swoją skrzynkę</h1>
  <p style="font-size:13px;color:#555">Jeśli konto o podanym adresie istnieje, wysłaliśmy na nie link do zresetowania hasła. Link jest ważny przez godzinę.</p>
</div>

<p style="text-align:center;margin-top:12px;font-size:12px"><a href="login.html" style="color:#06c">Wróć do logowania</a></p>
</div>
</div>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.style.display = 'none';
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Wysyłanie…';
  try {
    await Api.forgotPassword(document.getElementById('email').value);
    document.getElementById('formState').style.display = 'none';
    document.getElementById('sentState').style.display = 'block';
  } catch (ex) {
    err.textContent = ex.message || 'Błąd wysyłki. Spróbuj ponownie.';
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Wyślij link resetujący';
  }
});
</script>
</body></html>
