<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rejestracja sprzedawcy — Wholesale</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .section-label {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      color: #666;
      letter-spacing: .05em;
      margin: 18px 0 8px;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 3px; }
    .field input { width: 100%; border: 1px solid #ccc; padding: 8px; font-size: 13px; box-sizing: border-box; }
    .field input:focus { outline: none; border-color: #333; }
  </style>
</head>
<body>
<div class="topbar">
  <div class="container">
    <div>Rejestracja sprzedawcy</div>
    <div><a href="index.html">Strona główna</a></div>
  </div>
</div>

<div class="container" style="max-width:480px;margin:40px auto">
  <div style="background:#fff;border:1px solid #ddd;padding:24px">
    <h1 style="text-align:center;font-size:16px;margin-bottom:4px">Zostań sprzedawcą</h1>
    <p style="text-align:center;font-size:12px;color:#666;margin-bottom:16px">
      Twoje konto zostanie zweryfikowane przed aktywacją.
    </p>

    <div id="err" style="display:none;background:#fef2f2;border:1px solid #fecaca;color:#c00;padding:8px;margin-bottom:12px;font-size:12px"></div>
    <div id="ok"  style="display:none;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:8px;margin-bottom:12px;font-size:12px"></div>

    <form id="f">
      <!-- Account info -->
      <div class="section-label">Dane konta</div>

      <div class="field">
        <label>Imię i nazwisko</label>
        <input id="full_name" required placeholder="Jan Kowalski">
      </div>
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" required placeholder="jan@firma.pl">
      </div>
      <div class="field">
        <label>Hasło (min 8 znaków)</label>
        <input id="pwd" type="password" required>
      </div>
      <div class="field">
        <label>Potwierdź hasło</label>
        <input id="pwd2" type="password" required>
      </div>

      <!-- Business info -->
      <div class="section-label">Dane firmy</div>

      <div class="field">
        <label>Nazwa firmy</label>
        <input id="business_name" required placeholder="ABC Wholesale Sp. z o.o.">
      </div>
      <div class="field">
        <label>NIP</label>
        <input id="tax_id" placeholder="1234567890">
      </div>
      <div class="field">
        <label>Adres firmy</label>
        <input id="business_address" placeholder="ul. Handlowa 1, 00-001 Warszawa">
      </div>
      <div class="field">
        <label>Telefon</label>
        <input id="phone" type="tel" placeholder="+48 123 456 789">
      </div>

      <button type="submit" style="width:100%;padding:10px;background:#333;color:#fff;border:0;font-weight:bold;font-size:13px;margin-top:8px;cursor:pointer">
        Wyślij wniosek
      </button>
    </form>

    <p style="text-align:center;margin-top:14px;font-size:12px">
      Masz już konto? <a href="login.html" style="color:#06c">Zaloguj się</a>
    </p>
    <p style="text-align:center;margin-top:4px;font-size:12px">
      Kupujesz, nie sprzedajesz? <a href="signup.html" style="color:#06c">Zarejestruj się jako kupujący</a>
    </p>
  </div>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  const ok  = document.getElementById('ok');
  err.style.display = 'none';
  ok.style.display  = 'none';

  const full_name        = document.getElementById('full_name').value.trim();
  const email            = document.getElementById('email').value.trim();
  const pwd              = document.getElementById('pwd').value;
  const pwd2             = document.getElementById('pwd2').value;
  const business_name    = document.getElementById('business_name').value.trim();
  const tax_id           = document.getElementById('tax_id').value.trim();
  const business_address = document.getElementById('business_address').value.trim();
  const phone            = document.getElementById('phone').value.trim();

  // Client-side validation
  if (full_name.length < 2) { showErr('Imię i nazwisko — minimum 2 znaki'); return; }
  if (pwd !== pwd2)          { showErr('Hasła nie są zgodne'); return; }
  if (pwd.length < 8)        { showErr('Hasło min 8 znaków'); return; }
  if (business_name.length < 2) { showErr('Podaj nazwę firmy'); return; }

  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  btn.textContent = 'Wysyłanie…';

  try {
    await Api.registerSeller({
      email,
      password: pwd,
      full_name,
      // role is omitted — the /sellers/register endpoint always creates sellers server-side
      seller_profile: {
        business_name,
        // Send null (not undefined) for optional fields so JSON.stringify includes them explicitly
        tax_id:           tax_id           || null,
        business_address: business_address || null,
        phone:            phone            || null,
      }
    });

    ok.textContent = 'Wniosek wysłany! Po weryfikacji przez administratora otrzymasz dostęp do konta.';
    ok.style.display = 'block';
    document.getElementById('f').reset();
  } catch (ex) {
    showErr(ex.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Wyślij wniosek';
  }

  function showErr(msg) {
    err.textContent = msg;
    err.style.display = 'block';
  }
});
</script>
</body>
</html>
