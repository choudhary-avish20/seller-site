<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zaloguj się — WolkaGo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="topbar"><div class="container"><a href="index.html">Strona główna</a><a href="contact.html" class="topbar-contact"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg><span data-i18n="contact">Kontakt z nami</span></a></div></div>
<div class="container" style="max-width:420px;margin:40px auto">
<div style="text-align:center;margin-bottom:16px"><a href="index.html"><img src="assets/wolkago-logo.png" alt="WolkaGo" style="height:32px"></a></div>
<div style="background:#fff;border:1px solid #ddd;padding:20px">
<h1 style="font-size:16px;text-align:center">Zaloguj się</h1>

<!-- Generic error -->
<div id="err" style="display:none;background:#fef2f2;border:1px solid #fecaca;color:#c00;padding:8px;margin:12px 0;font-size:12px"></div>

<!-- Unverified-email notice — shown instead of generic error when backend returns 403 "verify" -->
<div id="unverified" style="display:none;background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 12px;margin:12px 0;font-size:12px;line-height:1.6">
  ⚠️ Adres e-mail nie został jeszcze potwierdzony.<br>
  <a id="resendLink" href="#" style="color:#92400e;font-weight:bold;text-decoration:underline">Wyślij nowy link weryfikacyjny</a>
</div>

<form id="f">
<label style="font-size:12px;font-weight:bold">Email</label><input id="email" type="email" required style="width:100%;border:1px solid #ccc;padding:8px;margin:4px 0 8px;box-sizing:border-box">
<label style="font-size:12px;font-weight:bold">Hasło</label><input id="pwd" type="password" required style="width:100%;border:1px solid #ccc;padding:8px;margin:4px 0 8px;box-sizing:border-box">
<button type="submit" style="width:100%;padding:10px;background:#333;color:#fff;border:0;font-weight:bold;cursor:pointer">Zaloguj się</button>
</form>
<p style="text-align:center;margin-top:12px;font-size:12px">Nie masz konta? <a href="signup.html" style="color:#06c">Zarejestruj się</a></p>
</div>
</div>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
// Already signed in? Don't show the login form again — go straight where they meant to go.
refreshUser().then(u => {
  if (!u) return;
  location.href = (u.role === 'admin' || u.role === 'seller')
    ? 'admin-dashboard.html'
    : safeNextUrl('index.html');
});

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err        = document.getElementById('err');
  const unverified = document.getElementById('unverified');
  err.style.display = 'none';
  unverified.style.display = 'none';

  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Logowanie…';

  try {
    await Api.login(document.getElementById('email').value, document.getElementById('pwd').value);
    const u = await Api.getMe();
    localStorage.setItem('user', JSON.stringify(u));
    location.href = (u.role === 'admin' || u.role === 'seller')
      ? 'admin-dashboard.html'
      : safeNextUrl('index.html');
  } catch (ex) {
    // 403 with "verify" in message = unverified email
    const isUnverified = ex.status === 403 &&
      (ex.message || '').toLowerCase().includes('verify');

    if (isUnverified) {
      unverified.style.display = 'block';
    } else {
      err.textContent = ex.message;
      err.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Zaloguj się';
  }
});

// Resend verification link
document.getElementById('resendLink').addEventListener('click', async e => {
  e.preventDefault();
  const link = e.target;
  link.textContent = 'Wysyłanie…';
  try {
    // User is logged in at this point (login succeeded but order was blocked)
    // Use the stored token to call resend
    const tok = localStorage.getItem('access_token');
    if (!tok) { location.href = 'signup.html'; return; }
    const base = API.raw;
    const res = await fetch(base + '/auth/resend-verification', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
    });
    if (res.ok) {
      document.getElementById('unverified').innerHTML =
        '✅ Nowy link weryfikacyjny został wysłany. Sprawdź skrzynkę e-mail.';
      document.getElementById('unverified').style.background = '#f0fdf4';
      document.getElementById('unverified').style.borderColor = '#bbf7d0';
      document.getElementById('unverified').style.color = '#166534';
    } else {
      const d = await res.json().catch(() => ({}));
      link.textContent = 'Wyślij nowy link weryfikacyjny';
      alert(d.detail || 'Błąd wysyłki. Spróbuj ponownie.');
    }
  } catch {
    link.textContent = 'Wyślij nowy link weryfikacyjny';
    alert('Błąd sieci. Spróbuj ponownie.');
  }
});
</script>
</body></html>
