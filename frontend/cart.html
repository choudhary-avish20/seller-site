<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koszyk — WolkaGo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="topbar"><div class="container"><div>Skontaktuj się: <b>+48 579 383 945</b></div><div><a href="index.html">Kontynuuj zakupy</a></div></div></div>
<div class="header"><div class="container"><a href="index.html" class="logo"><img src="assets/wolkago-logo.png" alt="WolkaGo"></a><a href="cart.html" class="cart">Koszyk <b data-cart-count>0</b></a></div></div>
<div class="container" style="padding:16px 10px">
<h1>Koszyk — <span id="count">0</span> packów</h1>
<div id="list" style="margin-top:12px"></div>
<div id="summary" style="margin-top:12px;background:#fff;border:1px solid #ddd;padding:12px;display:none">
<div style="display:flex;justify-content:space-between"><span>Suma netto</span><b id="net">0.00 zł</b></div>
<div style="display:flex;justify-content:space-between;font-weight:bold"><span>Suma brutto</span><b id="gross">0.00 zł</b></div>
<a href="checkout.html" style="display:block;margin-top:12px;padding:10px;background:#333;color:#fff;text-align:center;font-weight:bold">Przejdź do kasy</a>
</div>
</div>
<script src="js/app.js"></script>
<script>
function render(){
 const items=Cart.get();
 document.getElementById('count').textContent=Cart.count();
 const el=document.getElementById('list');
 if(!items.length){ el.innerHTML='<p style="padding:20px;background:#fff;border:1px solid #ddd;text-align:center">Koszyk pusty — <a href="index.html" style="color:#06c">Przeglądaj</a></p>'; document.getElementById('summary').style.display='none'; return; }
 document.getElementById('summary').style.display='block';
 el.innerHTML=items.map(it=>{
   const net=it.variantPriceNet!=null?it.variantPriceNet:it.product.price_net;
   const vat=it.product.vat_rate||23;
   const gross=+(net*(1+vat/100)).toFixed(2);
   return `<div style="background:#fff;border:1px solid #ddd;padding:10px;display:flex;gap:10px;margin-bottom:6px">
     <img src="${Api.img(it.product.images[0]||'')}" style="width:60px;height:60px;object-fit:contain;border:1px solid #eee">
     <div style="flex:1"><a href="product.html?slug=${it.product.slug}" style="font-weight:bold">${it.product.name}</a><div style="font-size:11px;color:#666">Pack ${it.product.pack_size} • ${it.product.category_name||''}</div><div style="font-size:12px">${gross.toFixed(2)} zł brutto (${net.toFixed(2)} netto) × ${it.packQuantity} = <b>${(gross*it.packQuantity).toFixed(2)} zł</b></div></div>
     <div style="text-align:center"><div style="display:flex;gap:4px;align-items:center"><button onclick="Cart.update('${it.product.id}','${it.variantId||''}',${it.packQuantity-1});render()" style="width:24px;height:24px">−</button><span style="width:30px;text-align:center">${it.packQuantity}</span><button onclick="Cart.update('${it.product.id}','${it.variantId||''}',${it.packQuantity+1});render()" style="width:24px;height:24px">+</button></div><button onclick="Cart.remove('${it.product.id}','${it.variantId||''}');render()" style="font-size:11px;color:#c00;background:none;border:0;cursor:pointer">Usuń</button></div>
   </div>`;
 }).join('');
 const t=Cart.totals(); document.getElementById('net').textContent=t.net.toFixed(2)+' zł'; document.getElementById('gross').textContent=t.gross.toFixed(2)+' zł';
}
Cart.update = (id,vid,qty)=>{ if(qty<1) Cart.remove(id,vid); else { let items=Cart.get(); const inc=items.find(x=>x.product.id===id && (x.variantId||'')===(vid||''))?.product.pack_increment||1; qty=Math.ceil(qty/inc)*inc; items=items.map(x=> x.product.id===id && (x.variantId||'')===(vid||'')? {...x,packQuantity:qty}:x); localStorage.setItem(Cart.key, JSON.stringify(items)); } render(); };
render();
</script>
</body></html>
