<script>
async function loadContent(){
  const el = document.getElementById('termsBody');
  try{
    const s = await Api.getSettings();
    el.textContent = s.shipping_content || 'Informacje o dostawie zostaną wkrótce opublikowane.';
  }catch(e){
    el.textContent = 'Nie udało się załadować treści. Spróbuj ponownie później.';
  }
}
loadContent();
</script>
